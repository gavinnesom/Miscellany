<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Chess Piece Evolution</title>
<desc id="desc">Piece lineages and the late medieval queen transformation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9eff"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:28px;font-weight:700;fill:#1d252d}.l{font-size:18px;font-weight:650;fill:#1d252d}.s{font-size:14px;fill:#596774}.eq{font-size:17px;font-weight:650;fill:#005fb8}</style></defs>
<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">Chess Piece Evolution</text>
<rect x="48" y="82" width="1024" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><g transform="translate(78 118)"><text x="470" y="0" text-anchor="middle" class="l">chaturanga → shatranj → medieval Europe → modern chess</text><g transform="translate(0 50)"><circle cx="22" cy="0" r="14" fill="#b98519"/><line x1="48" y1="0" x2="850" y2="0" stroke="#d6e0e8" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="6" class="l">infantry / pawn</text></g><g transform="translate(0 112)"><circle cx="22" cy="0" r="14" fill="#0b8f8a"/><line x1="48" y1="0" x2="850" y2="0" stroke="#d6e0e8" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="6" class="l">cavalry / knight</text></g><g transform="translate(0 174)"><circle cx="22" cy="0" r="14" fill="#005fb8"/><line x1="48" y1="0" x2="850" y2="0" stroke="#d6e0e8" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="6" class="l">elephant / bishop</text></g><g transform="translate(0 236)"><circle cx="22" cy="0" r="14" fill="#c2410c"/><line x1="48" y1="0" x2="850" y2="0" stroke="#d6e0e8" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="6" class="l">chariot / rook</text></g><g transform="translate(560 304)"><rect x="0" y="0" width="380" height="104" rx="8" fill="#f7fafc" stroke="#d6e0e8"/><text x="190" y="28" text-anchor="middle" class="l">queen transformation</text><text x="85" y="68" text-anchor="middle" class="s">old queen: weak step</text><path d="M230 68 H334 M282 16 V96 M238 24 L326 112 M326 24 L238 112" stroke="#c2410c" stroke-width="3"/><text x="282" y="92" text-anchor="middle" class="s">modern queen: rook + bishop</text></g></g>
</svg>
