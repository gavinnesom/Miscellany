<title>Vehicle energy paths</title><desc>Fuel energy branches into shaft work and heat. Shaft work supplies drivetrain and electrical loads. Motion can be dissipated at brakes. Battery stores or supplies electrical energy; not all paths operate simultaneously.</desc>
