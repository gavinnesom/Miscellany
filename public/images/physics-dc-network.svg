y="263" class="">3 Ω</text><text x="300" y="180" class="">9.6 V</text><text x="615" y="95" class="">4.8 V</text><text x="390" y="438" class="">0 V reference</text><path class="line" d="M305 78L350 78" marker-end="url(#arrow)"/><text x="293" y="58" class="small">2.4 A</text><path class="line" d="M620 175L620 210" marker-end="url(#arrow)"/><text x="630" y="195" class="small">0.8 A</text><path class="line" d="M780 175L780 210" marker-end="url(#arrow)"/><text x="792" y="195" class="small">1.6 A</text><text x="35" y="478" class="small">Schematic: line crossings at branches are electrical junctions.</text><circle cx="580" cy="125" r="5" fill="#334155"/><circle cx="580" cy="400" r="5" fill="#334155"/><circle cx="730" cy="125" r="5" fill="#334155"/><circle cx="730" cy="400" r="5" fill="#334155"/></svg>