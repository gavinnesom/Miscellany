<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Plaque Stabilization and Regression</title>
<desc id="desc">Schematic comparison of progressing plaque and treated stabilized plaque.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9eff"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:28px;font-weight:700;fill:#1d252d}.l{font-size:18px;font-weight:650;fill:#1d252d}.s{font-size:14px;fill:#596774}.eq{font-size:17px;font-weight:650;fill:#005fb8}</style></defs>
<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">Plaque Stabilization and Regression</text>
<rect x="48" y="82" width="1024" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><g transform="translate(92 120)"><text x="190" y="0" text-anchor="middle" class="l">progressing plaque</text><rect x="0" y="48" width="380" height="156" rx="78" fill="#f7fafc" stroke="#d6e0e8"/><rect x="0" y="94" width="380" height="64" fill="#fff"/><path d="M82 160 C126 72 236 78 300 160 C230 190 150 192 82 160" fill="#fff0c7" stroke="#b98519" stroke-width="4"/><path d="M118 146 C156 112 220 110 264 146" fill="none" stroke="#c2410c" stroke-width="9"/><circle cx="186" cy="140" r="24" fill="#c2410c" opacity="0.75"/><text x="190" y="242" text-anchor="middle" class="s">larger lipid/necrotic core, active inflammation</text></g><line x1="492" y1="232" x2="628" y2="232" stroke="#2e9eff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g transform="translate(648 120)"><text x="190" y="0" text-anchor="middle" class="l">treated / stabilized schematic</text><rect x="0" y="48" width="380" height="156" rx="78" fill="#f7fafc" stroke="#d6e0e8"/><rect x="0" y="94" width="380" height="64" fill="#fff"/><path d="M94 160 C136 102 232 104 286 160 C226 184 154 186 94 160" fill="#fff0c7" stroke="#b98519" stroke-width="4"/><path d="M110 142 C156 104 226 104 272 142" fill="none" stroke="#0b8f8a" stroke-width="12"/><circle cx="150" cy="150" r="10" fill="#596774"/><circle cx="230" cy="148" r="10" fill="#596774"/><text x="190" y="242" text-anchor="middle" class="s">smaller lipid burden, thicker cap, possible dense calcium</text></g><g transform="translate(220 388)"><rect x="0" y="0" width="680" height="62" rx="10" fill="#edf6ff" stroke="#d6e0e8"/><text x="340" y="25" text-anchor="middle" class="eq">modest plaque-volume change can matter less than biology</text><text x="340" y="48" text-anchor="middle" class="s">goal: less active, less rupture-prone disease process and fewer events</text></g>
</svg>
