<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Distillation vapor-liquid enrichment</title><desc id="desc">A still heats fermented wash, ethanol-enriched vapor condenses, and an inset explains vapor enrichment before the azeotrope.</desc><rect width="1120" height="620" fill="transparent"/><style>
.title{font:700 30px Georgia,serif;fill:#1d252d}.h{font:800 18px system-ui,sans-serif;fill:#1d252d}.s{font:600 14px system-ui,sans-serif;fill:#596774}.m{font:800 15px ui-monospace,Menlo,monospace;fill:#005fb8}.panel{fill:#fff;stroke:#d6e0e8;stroke-width:2}.soft{fill:#edf4fa;stroke:#d6e0e8;stroke-width:1.5}.blue{fill:#e7f3ff;stroke:#005fb8;stroke-width:2.5}.teal{fill:#dff0ff;stroke:#247a8a;stroke-width:2.5}.warn{fill:#fff;stroke:#b44747;stroke-width:2}.arrow{fill:none;stroke:#005fb8;stroke-width:3;stroke-linecap:round;marker-end:url(#a)}.thin{fill:none;stroke:#247a8a;stroke-width:2.5;stroke-linecap:round;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#005fb8"/></marker></defs>
<text class="title" x="50" y="55">Distillation separates; it does not create ethanol</text><text class="s" x="50" y="82">The vapor over a mixture can be richer in ethanol than the liquid.</text>
<g transform="translate(70 130)"><rect class="panel" x="0" y="120" width="260" height="210" rx="24"/><path d="M32 238 C90 210 165 270 228 232 V302 H32 Z" fill="#dff0ff"/><text class="h" x="130" y="174" text-anchor="middle">fermented wash</text><text class="s" x="130" y="202" text-anchor="middle">ethanol already exists</text><path class="arrow" d="M128 120 C130 60 245 48 318 80"/><rect class="soft" x="334" y="44" width="214" height="74" rx="16"/><text class="h" x="441" y="74" text-anchor="middle">vapor path</text><text class="s" x="441" y="96" text-anchor="middle">ethanol-enriched vapor</text><path class="arrow" d="M548 80 C626 80 670 118 690 174"/><rect class="teal" x="670" y="174" width="184" height="58" rx="16"/><text class="h" x="762" y="210" text-anchor="middle">condenser</text><path class="arrow" d="M762 232 V306"/><rect class="blue" x="678" y="306" width="168" height="56" rx="16"/><text class="h" x="762" y="340" text-anchor="middle">distillate</text><rect class="panel" x="560" y="18" width="392" height="120" rx="18"/><text class="h" x="756" y="48" text-anchor="middle">qualitative inset</text><rect class="blue" x="606" y="74" width="96" height="34" rx="9"/><text class="s" x="654" y="96" text-anchor="middle">liquid: lower EtOH</text><rect class="teal" x="770" y="66" width="128" height="50" rx="9"/><text class="s" x="834" y="96" text-anchor="middle">vapor: higher EtOH</text><path class="arrow" d="M704 90 H766"/><text class="s" x="756" y="154" text-anchor="middle">Near ~96% ABV, azeotropy ends simple enrichment.</text></g></svg>
