<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Myocardial Infarction Mechanism</title>
<desc id="desc">Coronary thrombus causing downstream ischemic myocardium.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9eff"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:28px;font-weight:700;fill:#1d252d}.l{font-size:18px;font-weight:650;fill:#1d252d}.s{font-size:14px;fill:#596774}.eq{font-size:17px;font-weight:650;fill:#005fb8}</style></defs>
<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">Myocardial Infarction Mechanism</text>
<rect x="48" y="82" width="1024" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><g transform="translate(78 120)"><rect x="0" y="0" width="420" height="270" rx="10" fill="#f7fafc" stroke="#d6e0e8"/><text x="210" y="32" text-anchor="middle" class="l">coronary artery</text><path d="M50 128 H360" stroke="#c2410c" stroke-width="42" stroke-linecap="round"/><path d="M50 128 H360" stroke="#fff" stroke-width="18" stroke-linecap="round"/><path d="M166 142 C200 86 260 94 288 142" fill="#fff0c7" stroke="#b98519" stroke-width="3"/><circle cx="292" cy="116" r="16" fill="#c2410c"/><circle cx="316" cy="124" r="14" fill="#c2410c"/><circle cx="338" cy="114" r="16" fill="#c2410c"/><line x1="92" y1="128" x2="148" y2="128" stroke="#c2410c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="352" y1="128" x2="385" y2="128" stroke="#c2410c" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="228" y="202" text-anchor="middle" class="eq">plaque disruption → thrombus</text></g><g transform="translate(580 112)"><path d="M190 60 C120 10 42 72 70 160 C88 232 190 310 190 310 C190 310 292 232 310 160 C338 72 260 10 190 60" fill="#fff1f2" stroke="#c2410c" stroke-width="4"/><path d="M190 82 C155 130 150 200 174 260" fill="none" stroke="#1d252d" stroke-width="3"/><path d="M190 82 C230 122 242 194 214 260" fill="none" stroke="#1d252d" stroke-width="3"/><path d="M178 132 C224 148 252 190 238 238 C204 218 180 184 178 132" fill="#ffd9cc" stroke="#c2410c" stroke-width="3"/><text x="190" y="344" text-anchor="middle" class="l">downstream ischemic territory</text><text x="190" y="374" text-anchor="middle" class="eq">ischemia → infarction if prolonged</text></g><text x="560" y="486" text-anchor="middle" class="eq">heart attack is blood-flow failure causing heart-muscle injury, not cardiac arrest itself</text>
</svg>
