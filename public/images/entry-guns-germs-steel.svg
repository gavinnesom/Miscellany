<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Guns, Germs, and Steel</title>
  <desc id="desc">Explanatory visual for Guns, Germs, and Steel.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e9eff"/></marker>
  </defs>
  <rect width="960" height="540" fill="transparent"/>
  <text x="48" y="54" text-anchor="start" font-size="28" font-weight="700" fill="#1d252d"><tspan x="48" dy="0">Guns, Germs, and Steel</tspan></text>
  <line x1="150" y1="290" x2="805" y2="290" stroke="#247a8a" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="480" y1="150" x2="480" y2="420" stroke="#004f99" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="480" y="260" text-anchor="middle" font-size="22" font-weight="700" fill="#1d252d"><tspan x="480" dy="0">Eurasian east-west</tspan><tspan x="480" dy="25.299999999999997">axis</tspan></text><text x="560" y="180" text-anchor="middle" font-size="18" font-weight="500" fill="#247a8a"><tspan x="560" dy="0">similar latitudes</tspan></text><text x="560" y="390" text-anchor="middle" font-size="18" font-weight="500" fill="#004f99"><tspan x="560" dy="0">north-south barriers</tspan></text><text x="480" y="465" text-anchor="middle" font-size="17" font-weight="500" fill="#596774"><tspan x="480" dy="0">Diamond's geography thesis: crops, animals, and technology</tspan><tspan x="480" dy="19.549999999999997">spread unevenly</tspan></text>
