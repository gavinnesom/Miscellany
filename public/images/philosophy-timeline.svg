<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Philosophy Timeline</title>
  <desc id="desc">Explanatory visual for Philosophy Timeline.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e9eff"/></marker>
  </defs>
  <rect width="960" height="540" fill="transparent"/>
  <text x="48" y="54" text-anchor="start" font-size="28" font-weight="700" fill="#1d252d"><tspan x="48" dy="0">Philosophy Timeline</tspan></text>
  <line x1="80" y1="285" x2="880" y2="285" stroke="#2e9eff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="105" cy="285" r="14" fill="#2e9eff" stroke="#fff" stroke-width="4"/>
<line x1="105" y1="235" x2="105" y2="335" stroke="#d6e0e8" stroke-width="2" stroke-linecap="round"/>
<text x="105" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#1d252d"><tspan x="105" dy="0">Socrates</tspan></text>
<text x="105" y="361" text-anchor="middle" font-size="16" font-weight="500" fill="#596774"><tspan x="105" dy="0">Greek questions</tspan></text>
<circle cx="255" cy="285" r="14" fill="#2e9eff" stroke="#fff" stroke-width="4"/>
<line x1="255" y1="235" x2="255" y2="335" stroke="#d6e0e8" stroke-width="2" stroke-linecap="round"/>
<text x="255" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#1d252d"><tspan x="255" dy="0">Confucius</tspan></text>
<text x="255" y="361" text-anchor="middle" font-size="16" font-weight="500" fill="#596774"><tspan x="255" dy="0">ritual + order</tspan></text>
<circle cx="405" cy="285" r="14" fill="#2e9eff" stroke="#fff" stroke-width="4"/>
<line x1="405" y1="235" x2="405" y2="335" stroke="#d6e0e8" stroke-width="2" stroke-linecap="round"/>
<text x="405" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#1d252d"><tspan x="405" dy="0">Descartes</tspan></text>
<text x="405" y="361" text-anchor="middle" font-size="16" font-weight="500" fill="#596774"><tspan x="405" dy="0">modern doubt</tspan></text>
<circle cx="555" cy="285" r="14" fill="#2e9eff" stroke="#fff" stroke-width="4"/>
<line x1="555" y1="235" x2="555" y2="335" stroke="#d6e0e8" stroke-width="2" stroke-linecap="round"/>
<text x="555" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#1d252d"><tspan x="555" dy="0">Hume / Kant</tspan></text>
<text x="555" y="361" text-anchor="middle" font-size="16" font-weight="500" fill="#596774"><tspan x="555" dy="0">knowledge recast</tspan></text>
<circle cx="705" cy="285" r="14" fill="#2e9eff" stroke="#fff" stroke-width="4"/>
<line x1="705" y1="235" x2="705" y2="335" stroke="#d6e0e8" stroke-width="2" stroke-linecap="round"/>
<text x="705" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#1d252d"><tspan x="705" dy="0">Nietzsche</tspan></text>
<text x="705" y="361" text-anchor="middle" font-size="16" font-weight="500" fill="#596774"><tspan x="705" dy="0">values</tspan><tspan x="705" dy="18.4">historicized</tspan></text>
<circle cx="855" cy="285" r="14" fill="#2e9eff" stroke="#fff" stroke-width="4"/>
<line x1="855" y1="235" x2="855" y2="335" stroke="#d6e0e8" stroke-width="2" stroke-linecap="round"/>
<text x="855" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#1d252d"><tspan x="855" dy="0">20th c.</tspan></text>
<text x="855" y="361" text-anchor="middle" font-size="16" font-weight="500" fill="#596774"><tspan x="855" dy="0">language + freedom</tspan></text>
