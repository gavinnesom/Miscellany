<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Ischemic and Hemorrhagic Stroke</title>
<desc id="desc">Split brain mechanism: blocked artery versus ruptured vessel, with imaging decision strip.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9eff"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:28px;font-weight:700;fill:#1d252d}.l{font-size:18px;font-weight:650;fill:#1d252d}.s{font-size:14px;fill:#596774}.eq{font-size:17px;font-weight:650;fill:#005fb8}</style></defs>
<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">Ischemic and Hemorrhagic Stroke</text>
<rect x="48" y="82" width="1024" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><g transform="translate(80 122)"><rect x="0" y="0" width="470" height="260" rx="10" fill="#f7fafc" stroke="#d6e0e8"/><text x="235" y="34" text-anchor="middle" class="l">ischemic: blocked flow</text><path d="M90 150 C145 64 310 64 365 150 C320 234 140 234 90 150" fill="#eaf8f7" stroke="#0b8f8a" stroke-width="3"/><path d="M92 150 H246" stroke="#c2410c" stroke-width="10" stroke-linecap="round"/><line x1="105" y1="150" x2="178" y2="150" stroke="#c2410c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="244" y="140" width="34" height="20" rx="8" fill="#1d252d"/><circle cx="302" cy="150" r="46" fill="#ffd9cc" stroke="#c2410c"/><circle cx="302" cy="150" r="23" fill="#c2410c" opacity="0.8"/><text x="302" y="224" text-anchor="middle" class="s">core + penumbra</text></g><g transform="translate(570 122)"><rect x="0" y="0" width="470" height="260" rx="10" fill="#f7fafc" stroke="#d6e0e8"/><text x="235" y="34" text-anchor="middle" class="l">hemorrhagic: bleeding</text><path d="M105 150 C160 64 325 64 380 150 C335 234 155 234 105 150" fill="#f6fbff" stroke="#005fb8" stroke-width="3"/><path d="M224 96 C240 122 202 138 224 164" fill="none" stroke="#c2410c" stroke-width="8" stroke-linecap="round"/><circle cx="252" cy="162" r="40" fill="#c2410c" opacity="0.75"/><circle cx="284" cy="190" r="26" fill="#c2410c" opacity="0.45"/><text x="260" y="224" text-anchor="middle" class="s">rupture → pressure effect</text></g><g transform="translate(188 420)"><rect x="0" y="0" width="744" height="44" rx="22" fill="#fff8e8" stroke="#ead6aa"/><line x1="32" y1="22" x2="182" y2="22" stroke="#b98519" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="298" y1="22" x2="448" y2="22" stroke="#b98519" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="566" y1="22" x2="704" y2="22" stroke="#b98519" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="32" y="27" class="s">sudden focal deficit</text><text x="214" y="27" class="s">emergency imaging</text><text x="480" y="27" class="s">ischemic vs hemorrhagic</text><text x="704" y="27" text-anchor="end" class="s">different pathways</text></g>
