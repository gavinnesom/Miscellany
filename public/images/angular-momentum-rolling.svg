<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Rotational Energy and Angular Momentum</title>
<desc id="desc">Skater inertia change and rolling hoop versus disk.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9eff"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:28px;font-weight:700;fill:#1d252d}.l{font-size:18px;font-weight:650;fill:#1d252d}.s{font-size:14px;fill:#596774}.eq{font-size:17px;font-weight:650;fill:#005fb8}</style></defs>
<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">Rotational Energy and Angular Momentum</text>
<rect x="48" y="82" width="1024" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><g transform="translate(88 118)"><text x="250" y="0" text-anchor="middle" class="l">small external torque: L stays fixed</text><circle cx="110" cy="140" r="28" fill="#f6fbff" stroke="#005fb8" stroke-width="3"/><line x1="42" y1="140" x2="178" y2="140" stroke="#005fb8" stroke-width="8" stroke-linecap="round"/><path d="M70 92 A58 58 0 1 1 69 93" fill="none" stroke="#0b8f8a" stroke-width="4" marker-end="url(#arrow)"/><circle cx="360" cy="140" r="28" fill="#f6fbff" stroke="#005fb8" stroke-width="3"/><line x1="324" y1="140" x2="396" y2="140" stroke="#005fb8" stroke-width="8" stroke-linecap="round"/><path d="M318 82 A70 70 0 1 1 317 83" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#arrow)"/><line x1="190" y1="140" x2="270" y2="140" stroke="#2e9eff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="110" y="230" text-anchor="middle" class="eq">large I, slower ω</text><text x="360" y="230" text-anchor="middle" class="eq">smaller I, faster ω</text><text x="236" y="280" text-anchor="middle" class="eq">Iᵢωᵢ = Iᶠωᶠ</text></g><g transform="translate(650 126)"><text x="185" y="0" text-anchor="middle" class="l">rolling without slipping</text><path d="M25 235 L345 105" stroke="#1d252d" stroke-width="5"/><circle cx="112" cy="196" r="34" fill="none" stroke="#005fb8" stroke-width="10"/><circle cx="244" cy="142" r="34" fill="#dff3f2" stroke="#0b8f8a" stroke-width="3"/><line x1="112" y1="196" x2="172" y2="170" stroke="#005fb8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="244" y1="142" x2="304" y2="116" stroke="#0b8f8a" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="112" y="274" text-anchor="middle" class="eq">hoop: more Krot</text><text x="244" y="274" text-anchor="middle" class="eq">disk: more vCM</text></g>
</svg>
