<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">History of Games Map</title>
<desc id="desc">Branching histories of game rule systems.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9eff"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:28px;font-weight:700;fill:#1d252d}.l{font-size:18px;font-weight:650;fill:#1d252d}.s{font-size:14px;fill:#596774}.eq{font-size:17px;font-weight:650;fill:#005fb8}</style></defs>
<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">History of Games Map</text>
<rect x="48" y="82" width="1024" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><g transform="translate(88 120)"><text x="120" y="0" class="l">mancala family</text><circle cx="40" cy="58" r="13" fill="#b98519"/><path d="M54 58 C105 34 150 28 202 38 M54 58 C112 78 162 96 226 118 M54 58 C112 58 164 60 236 72" fill="none" stroke="#b98519" stroke-width="4"/><text x="250" y="44" class="s">regional variants</text><text x="250" y="78" class="s">sowing games</text><text x="250" y="124" class="s">local rules</text><text x="480" y="0" class="l">Go</text><line x1="440" y1="58" x2="710" y2="58" stroke="#0b8f8a" stroke-width="5"/><circle cx="500" cy="58" r="8" fill="#0b8f8a"/><circle cx="610" cy="58" r="8" fill="#0b8f8a"/><text x="440" y="90" class="s">ancient China</text><text x="575" y="90" class="s">East Asia</text><text x="690" y="90" class="s">AI era</text><text x="120" y="205" class="l">chess</text><path d="M40 255 L150 255 L260 255 L380 255" fill="none" stroke="#005fb8" stroke-width="5" marker-end="url(#arrow)"/><text x="40" y="285" class="s">chaturanga</text><text x="144" y="285" class="s">shatranj</text><text x="250" y="285" class="s">Europe</text><text x="352" y="285" class="s">modern</text><text x="560" y="205" class="l">trick-taking</text><path d="M530 255 L650 255 L780 255 L900 255" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#arrow)"/><path d="M750 308 C798 292 820 278 850 255" fill="none" stroke="#b98519" stroke-width="4" marker-end="url(#arrow)"/><text x="530" y="285" class="s">whist</text><text x="640" y="285" class="s">bridge</text><text x="760" y="285" class="s">auction</text><text x="872" y="285" class="s">contract</text><text x="728" y="338" class="s">plafond influence</text><text x="520" y="386" text-anchor="middle" class="eq">rule systems branch, standardize, and keep evolving</text></g>
