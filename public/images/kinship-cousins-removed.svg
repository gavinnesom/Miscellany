<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Cousins and Removed</title>
<desc id="desc">Shared ancestor family tree with first cousins, second cousins, and first cousins once removed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9eff"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:28px;font-weight:700;fill:#1d252d}.l{font-size:18px;font-weight:650;fill:#1d252d}.s{font-size:14px;fill:#596774}.eq{font-size:17px;font-weight:650;fill:#005fb8}</style></defs>
<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">Cousins and Removed</text>
<rect x="48" y="82" width="1024" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><g transform="translate(120 104)"><rect x="390" y="0" width="160" height="44" rx="8" fill="#fff8e8" stroke="#b98519"/><text x="470" y="28" text-anchor="middle" class="l">shared ancestors</text><line x1="470" y1="44" x2="470" y2="86" stroke="#1d252d"/><line x1="240" y1="86" x2="700" y2="86" stroke="#1d252d"/><line x1="240" y1="86" x2="240" y2="128" stroke="#1d252d"/><line x1="700" y1="86" x2="700" y2="128" stroke="#1d252d"/><rect x="180" y="128" width="120" height="42" rx="8" fill="#f7fafc" stroke="#d6e0e8"/><text x="240" y="155" text-anchor="middle" class="s">child A</text><rect x="640" y="128" width="120" height="42" rx="8" fill="#f7fafc" stroke="#d6e0e8"/><text x="700" y="155" text-anchor="middle" class="s">child B</text><rect x="120" y="240" width="120" height="42" rx="8" fill="#f7fafc" stroke="#d6e0e8"/><text x="180" y="267" text-anchor="middle" class="s">grandchild</text><rect x="330" y="240" width="120" height="42" rx="8" fill="#f7fafc" stroke="#d6e0e8"/><text x="390" y="267" text-anchor="middle" class="s">grandchild</text><rect x="610" y="240" width="120" height="42" rx="8" fill="#f7fafc" stroke="#d6e0e8"/><text x="670" y="267" text-anchor="middle" class="s">grandchild</text><rect x="820" y="240" width="120" height="42" rx="8" fill="#f7fafc" stroke="#d6e0e8"/><text x="880" y="267" text-anchor="middle" class="s">grandchild</text><rect x="610" y="350" width="120" height="42" rx="8" fill="#f7fafc" stroke="#d6e0e8"/><text x="670" y="377" text-anchor="middle" class="s">great-grandchild</text><rect x="820" y="350" width="120" height="42" rx="8" fill="#f7fafc" stroke="#d6e0e8"/><text x="880" y="377" text-anchor="middle" class="s">great-grandchild</text><path d="M240 170 V202 H180 V240 M240 202 H390 V240 M700 170 V202 H670 V240 M700 202 H880 V240 M670 282 V318 H670 V350 M880 282 V318 H880 V350" fill="none" stroke="#1d252d" stroke-width="2"/><path d="M180 262 H670" stroke="#0b8f8a" stroke-width="5"/><text x="425" y="254" text-anchor="middle" class="eq">first cousins</text><path d="M670 372 H880" stroke="#005fb8" stroke-width="5"/><text x="775" y="410" text-anchor="middle" class="eq">second cousins</text><path d="M180 284 C292 340 452 364 670 372" fill="none" stroke="#c2410c" stroke-width="5"/><text x="390" y="356" text-anchor="middle" class="eq">first cousin once removed</text><text x="470" y="452" text-anchor="middle" class="s">degree = min(a,b)-1; removed = |a-b|</text></g>
</svg>
