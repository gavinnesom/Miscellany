<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc">
  <title id="title">Origins of Civilization Two-Scale Timeline</title>
  <desc id="desc">Two wide timelines showing that agriculture, cities, states, writing, and the Bronze Age occupy a tiny final portion of Homo sapiens history.</desc>
  <defs>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #202124; }
      .title { font-size: 28px; font-weight: 760; }
      .subtitle { font-size: 15px; fill: #5f6368; }
      .label { font-size: 14px; font-weight: 720; }
      .small { font-size: 12px; fill: #5f6368; }
      .tiny { font-size: 11px; fill: #5f6368; }
      .axis { stroke: #202124; stroke-width: 3; stroke-linecap: round; }
      .tick { stroke: #202124; stroke-width: 1.5; }
      .panel { fill: #ffffff; stroke: #d7d1c1; stroke-width: 1.1; rx: 8; }
      .holo { fill: #2f6f73; opacity: .24; }
      .farm { fill: #c9a227; opacity: .35; }
      .settle { fill: #7b8f3a; opacity: .26; }
      .bronze { fill: #b76e3f; opacity: .30; }
      .point { fill: #a1422b; stroke: #fff; stroke-width: 2; }
      .point2 { fill: #2f6f73; stroke: #fff; stroke-width: 2; }
      .bracket { fill: none; stroke: #8f6a00; stroke-width: 1.4; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <text x="28" y="38" class="title">Civilization Is a Tiny End Segment of Homo sapiens History</text>
  <text x="28" y="63" class="subtitle">Schematic, approximate dates. The lower line expands the small Holocene segment shown at the far right of the upper line.</text>

  <rect x="26" y="86" width="1068" height="110" class="panel"/>
  <text x="48" y="115" class="label">~300,000 years ago to present</text>
  <line x1="72" y1="150" x2="1038" y2="150" class="axis"/>
  <rect x="1000" y="128" width="38" height="44" class="holo"/>
  <line x1="72" y1="139" x2="72" y2="161" class="tick"/>
  <line x1="1038" y1="139" x2="1038" y2="161" class="tick"/>
  <circle cx="72" cy="150" r="7" class="point"/>
  <circle cx="810" cy="150" r="6" class="point2"/>
  <circle cx="838" cy="150" r="5.5" class="point2"/>
  <circle cx="990" cy="150" r="5.5" class="point2"/>
  <text x="72" y="178" text-anchor="middle" class="small">early sapiens</text>
  <text x="72" y="192" text-anchor="middle" class="tiny">Jebel Irhoud ~315 +/- 34 ka</text>
  <text x="810" y="126" text-anchor="middle" class="small">main expansion</text>
  <text x="810" y="140" text-anchor="middle" class="tiny">~70-50 ka</text>
  <text x="838" y="178" text-anchor="middle" class="tiny">Sahul ~65 ka</text>
  <text x="990" y="126" text-anchor="middle" class="tiny">Americas debated</text>
  <text x="1019" y="188" text-anchor="middle" class="small">Holocene: last 11.7 ka</text>
  <path d="M1000 122 C964 103 942 91 905 89" class="bracket"/>
  <text x="704" y="94" class="small">The whole civilization story sits inside this narrow end of the upper scale.</text>

  <rect x="26" y="226" width="1068" height="126" class="panel"/>
  <text x="48" y="255" class="label">Zoom: 12,000 BCE to 1100 BCE</text>
  <line x1="72" y1="300" x2="1038" y2="300" class="axis"/>
  <line x1="72" y1="289" x2="72" y2="311" class="tick"/>
  <line x1="1038" y1="289" x2="1038" y2="311" class="tick"/>
  <rect x="240" y="282" width="170" height="18" class="farm"/>
  <rect x="523" y="300" width="136" height="18" class="settle"/>
  <rect x="742" y="282" width="250" height="18" class="bronze"/>
  <circle cx="286" cy="300" r="6.5" class="point"/>
  <circle cx="838" cy="300" r="6" class="point"/>
  <circle cx="859" cy="300" r="5.5" class="point"/>
  <circle cx="904" cy="300" r="5.5" class="point2"/>
  <circle cx="925" cy="300" r="5.5" class="point"/>
  <circle cx="964" cy="300" r="5.5" class="point2"/>
  <circle cx="976" cy="300" r="5.5" class="point"/>
  <circle cx="1015" cy="300" r="6" class="point"/>
  <text x="72" y="330" text-anchor="middle" class="small">12,000 BCE</text>
  <text x="286" y="275" text-anchor="middle" class="small">Gobekli Tepe</text>
  <text x="286" y="343" text-anchor="middle" class="tiny">9600-8200 BCE</text>
  <text x="326" y="275" text-anchor="middle" class="tiny">farming is gradual</text>
  <text x="590" y="343" text-anchor="middle" class="tiny">large settled communities</text>
  <text x="838" y="275" text-anchor="middle" class="small">Uruk + proto-writing</text>
  <text x="859" y="327" class="tiny">Egypt ~3100 BCE</text>
  <text x="904" y="343" text-anchor="middle" class="tiny">Indus ~2600-1900 BCE</text>
  <text x="925" y="257" text-anchor="middle" class="tiny">Akkad</text>
  <text x="964" y="327" class="tiny">Minoan centers</text>
  <text x="976" y="343" text-anchor="middle" class="tiny">Hammurabi</text>
  <text x="1015" y="275" text-anchor="middle" class="small">collapse / transformation</text>
  <text x="1038" y="330" text-anchor="middle" class="small">1100 BCE</text>
</svg>
