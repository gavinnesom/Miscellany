<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Momentum and Impulse</title>
<desc id="desc">Equal-area hard and soft stopping curves plus before and after cart momentum vectors.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9eff"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:28px;font-weight:700;fill:#1d252d}.l{font-size:18px;font-weight:650;fill:#1d252d}.s{font-size:14px;fill:#596774}.eq{font-size:17px;font-weight:650;fill:#005fb8}</style></defs>
<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">Momentum and Impulse</text>
<rect x="48" y="82" width="1024" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><g transform="translate(92 122)"><text x="175" y="0" text-anchor="middle" class="l">same impulse area</text><line x1="0" y1="250" x2="350" y2="250" stroke="#1d252d"/><line x1="0" y1="250" x2="0" y2="30" stroke="#1d252d"/><path d="M50 250 C70 60 100 60 120 250 Z" fill="#ffd9cc" stroke="#c2410c" stroke-width="3"/><path d="M170 250 C230 135 300 135 340 250 Z" fill="#dff3f2" stroke="#0b8f8a" stroke-width="3"/><text x="84" y="282" text-anchor="middle" class="s">hard stop</text><text x="260" y="282" text-anchor="middle" class="s">soft stop</text><text x="-24" y="38" class="eq">F</text><text x="330" y="272" class="eq">t</text></g><g transform="translate(540 130)"><text x="250" y="0" text-anchor="middle" class="l">system momentum before and after</text><rect x="40" y="95" width="95" height="52" rx="8" fill="#eaf8f7" stroke="#0b8f8a"/><rect x="260" y="95" width="95" height="52" rx="8" fill="#fff8e8" stroke="#b98519"/><line x1="135" y1="121" x2="235" y2="121" stroke="#005fb8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="355" y1="121" x2="405" y2="121" stroke="#005fb8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="210" y="165" text-anchor="middle" class="s">before</text><rect x="145" y="245" width="140" height="52" rx="8" fill="#f7fafc" stroke="#d6e0e8"/><line x1="285" y1="271" x2="392" y2="271" stroke="#005fb8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="215" y="318" text-anchor="middle" class="s">after: internal forces exchanged p</text></g>
</svg>
