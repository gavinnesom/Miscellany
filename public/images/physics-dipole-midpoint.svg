<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc"><title id="title">The midpoint: scalar potential cancels, vectors add</title><desc id="desc">Two equal opposite charges are placed symmetrically. At their midpoint, the positive charge field and negative charge field both point right, while the positive and negative potentials cancel.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><style>text{font-family:system-ui,sans-serif;font-size:22px;fill:#172554}.small{font-size:18px}.line{fill:none;stroke:#334155;stroke-width:3}.dash{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 5}</style><text x="35" y="38" font-size="26" font-weight="bold">The midpoint: scalar potential cancels, vectors add</text><path class="line" d="M150 220L740 220"/><circle cx="170" cy="220" r="34" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><circle cx="730" cy="220" r="34" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="158" y="229" class="">+</text><text x="720" y="229" class="">−</text><text x="132" y="282" class="">+Q</text><text x="709" y="282" class="">−Q</text><circle cx="450" cy="220" r="6" fill="#334155"/><path class="line" d="M450 156L565 156" marker-end="url(#arrow)"/><text x="260" y="163" class="">field from +Q</text><path class="line" d="M450 195L565 195" marker-end="url(#arrow)"/><text x="260" y="200" class="">field from −Q</text><text x="392" y="260" class="">midpoint</text><text x="300" y="322" class="">V = 0, but E points right</text><text x="35" y="378" class="small">Schematic: arrows show field contributions at the midpoint, not particle motion.</text></svg>