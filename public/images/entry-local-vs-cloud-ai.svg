<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Why Local vs Cloud AI Models Differ</title>
  <desc id="desc">Explanatory visual for Why Local vs Cloud AI Models Differ.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e9eff"/></marker>
  </defs>
  <rect width="960" height="540" fill="transparent"/>
  <text x="48" y="54" text-anchor="start" font-size="28" font-weight="700" fill="#1d252d"><tspan x="48" dy="0">Why Local vs Cloud AI Models Differ</tspan></text>
  <rect x="70" y="120" width="350" height="330" rx="10" fill="#dff0ff" stroke="#d6e0e8" stroke-width="2"/>
<rect x="540" y="120" width="350" height="330" rx="10" fill="#e7f3ff" stroke="#d6e0e8" stroke-width="2"/>
<text x="245" y="165" text-anchor="middle" font-size="24" font-weight="700" fill="#1d252d"><tspan x="245" dy="0">local</tspan></text>
<text x="715" y="165" text-anchor="middle" font-size="24" font-weight="700" fill="#1d252d"><tspan x="715" dy="0">cloud</tspan></text>
<text x="245" y="225" text-anchor="middle" font-size="18" font-weight="500" fill="#1d252d"><tspan x="245" dy="0">weights on your device</tspan></text>
<text x="245" y="279" text-anchor="middle" font-size="18" font-weight="500" fill="#1d252d"><tspan x="245" dy="0">memory is the hard limit</tspan></text>
<text x="245" y="333" text-anchor="middle" font-size="18" font-weight="500" fill="#1d252d"><tspan x="245" dy="0">private by default</tspan></text>
<text x="715" y="225" text-anchor="middle" font-size="18" font-weight="500" fill="#1d252d"><tspan x="715" dy="0">datacenter GPUs</tspan></text>
<text x="715" y="279" text-anchor="middle" font-size="18" font-weight="500" fill="#1d252d"><tspan x="715" dy="0">larger model options</tspan></text>
<text x="715" y="333" text-anchor="middle" font-size="18" font-weight="500" fill="#1d252d"><tspan x="715" dy="0">network/provider trust</tspan></text>
<line x1="430" y1="285" x2="530" y2="285" stroke="#2e9eff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="480" y="258" text-anchor="middle" font-size="16" font-weight="500" fill="#596774"><tspan x="480" dy="0">where</tspan><tspan x="480" dy="18.4">compute</tspan><tspan x="480" dy="18.4">lives</tspan></text>
