<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Kinematics Graph Hierarchy</title>
<desc id="desc">Position dots and aligned x(t), v(t), and a(t) graphs showing slope and area.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9eff"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:28px;font-weight:700;fill:#1d252d}.l{font-size:18px;font-weight:650;fill:#1d252d}.s{font-size:14px;fill:#596774}.eq{font-size:17px;font-weight:650;fill:#005fb8}</style></defs>
<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">Kinematics Graph Hierarchy</text>
<rect x="48" y="82" width="1024" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><line x1="100" y1="132" x2="430" y2="132" stroke="#d6e0e8" stroke-width="4"/><circle cx="135" cy="132" r="8" fill="#005fb8"/><circle cx="195" cy="132" r="8" fill="#005fb8"/><circle cx="280" cy="132" r="8" fill="#005fb8"/><circle cx="390" cy="132" r="8" fill="#005fb8"/><text x="260" y="104" text-anchor="middle" class="l">motion dots spread out: speeding up</text><line x1="445" y1="132" x2="520" y2="132" stroke="#2e9eff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g transform="translate(570 108)"><text x="190" y="0" text-anchor="middle" class="l">graphs line up in time</text><line x1="0" y1="90" x2="390" y2="90" stroke="#1d252d"/><line x1="0" y1="90" x2="0" y2="20" stroke="#1d252d"/><path d="M0 88 C100 84 230 54 390 22" fill="none" stroke="#005fb8" stroke-width="4"/><text x="410" y="28" class="eq">x(t)</text><line x1="0" y1="205" x2="390" y2="205" stroke="#1d252d"/><line x1="0" y1="205" x2="0" y2="135" stroke="#1d252d"/><path d="M0 198 L390 142" fill="none" stroke="#0b8f8a" stroke-width="4"/><path d="M70 205 L70 188 L260 160 L260 205 Z" fill="#dff3f2" stroke="none"/><text x="410" y="148" class="eq">v(t)</text><line x1="0" y1="320" x2="390" y2="320" stroke="#1d252d"/><line x1="0" y1="320" x2="0" y2="250" stroke="#1d252d"/><path d="M0 275 L390 275" fill="none" stroke="#b98519" stroke-width="4"/><path d="M70 320 L70 275 L260 275 L260 320 Z" fill="#fff0c7"/><text x="410" y="281" class="eq">a(t)</text><text x="190" y="112" text-anchor="middle" class="s">slope → velocity</text><text x="190" y="228" text-anchor="middle" class="s">area → displacement</text><text x="190" y="344" text-anchor="middle" class="s">area → Δv</text></g>
</svg>
