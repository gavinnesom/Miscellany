<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Work, Energy, and Power</title>
<desc id="desc">A cart on a changing-height track with energy bars and force from potential-energy slope.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9eff"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:28px;font-weight:700;fill:#1d252d}.l{font-size:18px;font-weight:650;fill:#1d252d}.s{font-size:14px;fill:#596774}.eq{font-size:17px;font-weight:650;fill:#005fb8}</style></defs>
<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">Work, Energy, and Power</text>
<rect x="48" y="82" width="1024" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><path d="M92 330 C210 180 330 180 450 330 S690 450 820 220 S960 170 1030 250" fill="none" stroke="#1d252d" stroke-width="5"/><circle cx="160" cy="260" r="18" fill="#005fb8"/><circle cx="480" cy="344" r="18" fill="#005fb8"/><circle cx="850" cy="206" r="18" fill="#005fb8"/><text x="300" y="122" class="l">energy bars follow the state</text><g transform="translate(128 372)"><rect x="0" y="0" width="28" height="70" fill="#b98519"/><rect x="36" y="45" width="28" height="25" fill="#0b8f8a"/><text x="32" y="94" text-anchor="middle" class="s">high U</text></g><g transform="translate(448 372)"><rect x="0" y="45" width="28" height="25" fill="#b98519"/><rect x="36" y="0" width="28" height="70" fill="#0b8f8a"/><text x="32" y="94" text-anchor="middle" class="s">high K</text></g><g transform="translate(818 372)"><rect x="0" y="0" width="28" height="70" fill="#b98519"/><rect x="36" y="38" width="28" height="32" fill="#0b8f8a"/><rect x="72" y="52" width="28" height="18" fill="#c2410c"/><text x="50" y="94" text-anchor="middle" class="s">some thermal</text></g><g transform="translate(670 112)"><rect x="0" y="0" width="350" height="132" rx="8" fill="#f7fafc" stroke="#d6e0e8"/><path d="M28 104 C95 22 162 22 226 104 S310 112 330 58" fill="none" stroke="#b98519" stroke-width="4"/><line x1="156" y1="48" x2="122" y2="78" stroke="#c2410c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="176" y="30" text-anchor="middle" class="eq">F = -dU/dx</text><text x="176" y="124" text-anchor="middle" class="s">force points downhill on U(x)</text></g>
</svg>
