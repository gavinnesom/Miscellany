<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Blood Pressure Waveform</title>
<desc id="desc">Systolic and diastolic pressure, pulse pressure, MAP, and arterial stiffness.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9eff"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:28px;font-weight:700;fill:#1d252d}.l{font-size:18px;font-weight:650;fill:#1d252d}.s{font-size:14px;fill:#596774}.eq{font-size:17px;font-weight:650;fill:#005fb8}</style></defs>
<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">Blood Pressure Waveform</text>
<rect x="48" y="82" width="1024" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><g transform="translate(90 120)"><line x1="0" y1="260" x2="620" y2="260" stroke="#1d252d"/><line x1="0" y1="260" x2="0" y2="20" stroke="#1d252d"/><path d="M0 205 C32 195 42 66 90 60 C135 55 150 198 210 205 C242 198 255 66 300 60 C346 55 365 198 420 205 C465 198 478 66 520 60 C566 55 586 198 620 205" fill="none" stroke="#005fb8" stroke-width="5"/><line x1="0" y1="60" x2="620" y2="60" stroke="#c2410c" stroke-dasharray="7 7"/><line x1="0" y1="205" x2="620" y2="205" stroke="#0b8f8a" stroke-dasharray="7 7"/><rect x="0" y="136" width="620" height="8" fill="#b98519" opacity="0.6"/><text x="635" y="65" class="eq">systolic</text><text x="635" y="210" class="eq">diastolic</text><text x="635" y="146" class="eq">MAP</text><line x1="110" y1="60" x2="110" y2="205" stroke="#c2410c" stroke-width="3"/><text x="132" y="136" class="eq">pulse pressure</text><text x="310" y="296" text-anchor="middle" class="l">120/80 samples one pulsating arterial wave</text></g><g transform="translate(780 138)"><rect x="0" y="0" width="260" height="250" rx="8" fill="#f7fafc" stroke="#d6e0e8"/><path d="M42 86 C85 36 130 36 176 86 S228 136 240 88" fill="none" stroke="#0b8f8a" stroke-width="5"/><path d="M42 190 C82 46 132 46 172 190 S220 264 240 196" fill="none" stroke="#c2410c" stroke-width="5"/><text x="130" y="34" text-anchor="middle" class="l">same stroke volume</text><text x="130" y="124" text-anchor="middle" class="s">elastic artery: smaller excursion</text><text x="130" y="224" text-anchor="middle" class="s">stiff artery: larger systolic rise</text></g>
</svg>
