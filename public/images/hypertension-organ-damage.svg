<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">Hypertension Organ Effects</text>
<rect x="48" y="82" width="1024" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><g transform="translate(80 110)"><path d="M470 70 C360 130 320 210 240 290" fill="none" stroke="#c2410c" stroke-width="14" stroke-linecap="round"/><path d="M470 70 C510 150 540 220 560 318" fill="none" stroke="#c2410c" stroke-width="14" stroke-linecap="round"/><path d="M470 70 C630 130 720 210 828 290" fill="none" stroke="#c2410c" stroke-width="14" stroke-linecap="round"/><circle cx="470" cy="70" r="46" fill="#fff1f2" stroke="#c2410c" stroke-width="3"/><text x="470" y="64" text-anchor="middle" class="l">chronic high</text><text x="470" y="88" text-anchor="middle" class="l">pressure</text><g transform="translate(40 260)"><rect x="0" y="0" width="230" height="92" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><path d="M24 48 H190" stroke="#c2410c" stroke-width="16"/><path d="M24 48 H190" stroke="#1d252d" stroke-width="3"/><text x="115" y="28" text-anchor="middle" class="l">large arteries</text><text x="115" y="78" text-anchor="middle" class="s">stiffness / remodeling</text></g><g transform="translate(338 302)"><rect x="0" y="0" width="230" height="92" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><path d="M62 52 C50 25 82 18 104 40 C126 18 158 25 146 52 C134 78 104 84 104 84 C104 84 74 78 62 52" fill="#fff1f2" stroke="#c2410c" stroke-width="3"/><text x="156" y="36" class="l">heart</text><text x="156" y="62" class="s">afterload → LVH</text></g><g transform="translate(682 260)"><rect x="0" y="0" width="230" height="92" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><ellipse cx="64" cy="52" rx="32" ry="42" fill="#eaf8f7" stroke="#0b8f8a" stroke-width="3"/><text x="142" y="34" class="l">kidney</text><text x="142" y="60" class="s">microvessels + volume</text></g><g transform="translate(476 126)"><rect x="0" y="0" width="260" height="82" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><path d="M58 50 C36 20 82 10 100 38 C124 8 170 24 148 58 C120 76 72 74 58 50" fill="#f6fbff" stroke="#005fb8" stroke-width="3"/><text x="160" y="34" class="l">brain</text><text x="160" y="60" class="s">small-vessel injury</text></g><text x="500" y="430" text-anchor="middle" class="eq">risk factor over years, not proof of an acute event</text></g>
