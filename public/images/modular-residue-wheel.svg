<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-labelledby="title desc"><title id="title">Remainders on a twelve-position wheel</title><desc id="desc">Five clockwise unit steps from ten pass through eleven, zero, one and two to land on three.</desc><rect width="480" height="380" fill="#faf8f1"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b24b32"/></marker></defs><circle cx="240" cy="165" r="123" fill="none" stroke="#cbc5b7" stroke-width="2"/><circle cx="240.0" cy="42.0" r="19" fill="#f3ddd0" stroke="#cbc5b7"/><text x="240.0" y="50.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#262c2b">0</text><circle cx="301.5" cy="58.5" r="19" fill="#f3ddd0" stroke="#cbc5b7"/><text x="301.5" y="66.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#262c2b">1</text><circle cx="346.5" cy="103.5" r="19" fill="#f3ddd0" stroke="#cbc5b7"/><text x="346.5" y="111.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#262c2b">2</text><circle cx="363.0" cy="165.0" r="19" fill="#f3ddd0" stroke="#cbc5b7"/><text x="363.0" y="173.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#262c2b">3</text><circle cx="346.5" cy="226.5" r="19" fill="#faf8f1" stroke="#cbc5b7"/><text x="346.5" y="234.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#262c2b">4</text><circle cx="301.5" cy="271.5" r="19" fill="#faf8f1" stroke="#cbc5b7"/><text x="301.5" y="279.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#262c2b">5</text><circle cx="240.0" cy="288.0" r="19" fill="#faf8f1" stroke="#cbc5b7"/><text x="240.0" y="296.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#262c2b">6</text><circle cx="178.5" cy="271.5" r="19" fill="#faf8f1" stroke="#cbc5b7"/><text x="178.5" y="279.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#262c2b">7</text><circle cx="133.5" cy="226.5" r="19" fill="#faf8f1" stroke="#cbc5b7"/><text x="133.5" y="234.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#262c2b">8</text><circle cx="117.0" cy="165.0" r="19" fill="#faf8f1" stroke="#cbc5b7"/><text x="117.0" y="173.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#262c2b">9</text><circle cx="133.5" cy="103.5" r="19" fill="#f3ddd0" stroke="#cbc5b7"/><text x="133.5" y="111.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#262c2b">10</text><circle cx="178.5" cy="58.5" r="19" fill="#f3ddd0" stroke="#cbc5b7"/><text x="178.5" y="66.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#262c2b">11</text><path d="M109.2 89.5 A151 151 0 0 1 164.5 34.2" fill="none" stroke="#b24b32" stroke-width="3" marker-end="url(#arrow)"/><path d="M164.5 34.2 A151 151 0 0 1 240.0 14.0" fill="none" stroke="#b24b32" stroke-width="3" marker-end="url(#arrow)"/><path d="M240.0 14.0 A151 151 0 0 1 315.5 34.2" fill="none" stroke="#b24b32" stroke-width="3" marker-end="url(#arrow)"/><path d="M315.5 34.2 A151 151 0 0 1 370.8 89.5" fill="none" stroke="#b24b32" stroke-width="3" marker-end="url(#arrow)"/><path d="M370.8 89.5 A151 151 0 0 1 391.0 165.0" fill="none" stroke="#b24b32" stroke-width="3" marker-end="url(#arrow)"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#262c2b"><text x="240" y="154" font-size="27">10 + 5 ≡ 3</text><text x="240" y="188" font-size="21">modulo 12</text><text x="240" y="342" font-size="21">Five steps; one wrap through 0.</text></g></svg>
