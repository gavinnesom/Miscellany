<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Simple Harmonic Motion Phase</title>
<desc id="desc">Spring mass phases with aligned x, v, a curves and energy exchange.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9eff"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:28px;font-weight:700;fill:#1d252d}.l{font-size:18px;font-weight:650;fill:#1d252d}.s{font-size:14px;fill:#596774}.eq{font-size:17px;font-weight:650;fill:#005fb8}</style></defs>
<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">Simple Harmonic Motion Phase</text>
<rect x="48" y="82" width="1024" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><g transform="translate(78 120)"><line x1="20" y1="100" x2="320" y2="100" stroke="#d6e0e8" stroke-width="4"/><path d="M40 100 h35 q8 -28 16 0 t16 0 t16 0 t16 0 h35" fill="none" stroke="#005fb8" stroke-width="4"/><rect x="180" y="72" width="58" height="56" rx="8" fill="#eaf8f7" stroke="#0b8f8a"/><line x1="208" y1="58" x2="208" y2="142" stroke="#d6e0e8" stroke-dasharray="6 6"/><text x="178" y="168" text-anchor="middle" class="l">spring-mass</text><rect x="52" y="220" width="28" height="60" fill="#b98519"/><rect x="88" y="265" width="28" height="15" fill="#0b8f8a"/><rect x="178" y="250" width="28" height="30" fill="#b98519"/><rect x="214" y="220" width="28" height="60" fill="#0b8f8a"/><text x="151" y="306" text-anchor="middle" class="s">potential ↔ kinetic</text></g><g transform="translate(460 120)"><line x1="0" y1="80" x2="560" y2="80" stroke="#d6e0e8"/><path d="M0 80 C70 20 140 20 210 80 S350 140 420 80 S520 20 560 56" fill="none" stroke="#005fb8" stroke-width="4"/><path d="M0 30 C70 80 140 140 210 80 S350 20 420 80 S520 140 560 105" fill="none" stroke="#0b8f8a" stroke-width="4"/><path d="M0 120 C70 80 140 20 210 80 S350 140 420 80 S520 20 560 55" fill="none" stroke="#c2410c" stroke-width="4"/><text x="582" y="58" class="eq">x</text><text x="582" y="105" class="eq">v</text><text x="582" y="132" class="eq">a</text><text x="280" y="206" text-anchor="middle" class="l">v max at equilibrium; a points opposite x</text><text x="280" y="246" text-anchor="middle" class="eq">T = 2π√(m/k)</text></g>
</svg>
