<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Cardiovascular Risk Trajectory</title>
<desc id="desc">Schematic longitudinal risk exposures and intervention bending risk trajectory.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9eff"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:28px;font-weight:700;fill:#1d252d}.l{font-size:18px;font-weight:650;fill:#1d252d}.s{font-size:14px;fill:#596774}.eq{font-size:17px;font-weight:650;fill:#005fb8}</style></defs>
<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">Cardiovascular Risk Trajectory</text>
<rect x="48" y="82" width="1024" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><text x="560" y="96" text-anchor="middle" class="l">schematic, not a quantitative risk curve</text><g transform="translate(94 138)"><line x1="0" y1="270" x2="820" y2="270" stroke="#1d252d"/><line x1="0" y1="270" x2="0" y2="20" stroke="#1d252d"/><text x="410" y="306" text-anchor="middle" class="s">decades of exposure</text><text x="-24" y="38" class="s" transform="rotate(-90 -24 38)">event probability</text><path d="M20 252 C160 234 250 200 350 150 S610 54 800 44" fill="none" stroke="#c2410c" stroke-width="5"/><path d="M20 252 C160 234 250 200 350 150 C460 124 560 120 800 100" fill="none" stroke="#0b8f8a" stroke-width="5" stroke-dasharray="9 7"/><line x1="358" y1="40" x2="358" y2="270" stroke="#b98519" stroke-width="3" stroke-dasharray="8 6"/><text x="374" y="64" class="eq">intervention bends trajectory</text><g transform="translate(60 30)"><rect x="0" y="0" width="170" height="30" rx="15" fill="#ffd9cc"/><text x="85" y="20" text-anchor="middle" class="s">blood pressure</text><rect x="0" y="44" width="220" height="30" rx="15" fill="#fff0c7"/><text x="110" y="64" text-anchor="middle" class="s">apoB / LDL exposure</text><rect x="0" y="88" width="132" height="30" rx="15" fill="#dff3f2"/><text x="66" y="108" text-anchor="middle" class="s">smoking</text><rect x="0" y="132" width="190" height="30" rx="15" fill="#edf6ff"/><text x="95" y="152" text-anchor="middle" class="s">glucose / diabetes</text></g><text x="670" y="178" class="l">risk factors change probability, not destiny</text></g>
</svg>
