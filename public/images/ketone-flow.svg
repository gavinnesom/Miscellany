<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Ketone flow</title>
  <desc id="desc">Adipose triglyceride becomes fatty acid, liver beta-oxidation makes acetyl-CoA, ketone bodies circulate to brain, muscle, and heart.</desc>
  <rect width="980" height="520" fill="transparent"/>
  <style>.h{font:700 28px Georgia,serif;fill:#1d252d}.t{font:600 18px system-ui,sans-serif;fill:#1d252d}.s{font:15px system-ui,sans-serif;fill:#596774}.box{fill:#edf4fa;stroke:#d6e0e8;stroke-width:2}.green{fill:#dff0ff;stroke:#247a8a;stroke-width:2}.blue{fill:#e7f3ff;stroke:#2e9eff;stroke-width:2}.arrow{stroke:#004f99;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#004f99"/></marker></defs>
  <text class="h" x="44" y="58">ketone bodies package fat-derived energy for circulation</text>
  <rect class="box" x="44" y="128" width="170" height="88" rx="14"/><text class="t" x="82" y="162">adipose</text><text class="s" x="74" y="188">triglyceride</text>
  <rect class="box" x="278" y="128" width="170" height="88" rx="14"/><text class="t" x="308" y="162">fatty acids</text><text class="s" x="306" y="188">travel to liver</text>
  <rect class="green" x="512" y="104" width="190" height="136" rx="16"/><text class="t" x="584" y="142">liver</text><text class="s" x="548" y="168">beta-oxidation</text><text class="s" x="552" y="194">acetyl-CoA</text><text class="s" x="536" y="220">BHB + acetoacetate</text>
  <rect class="blue" x="766" y="128" width="170" height="88" rx="14"/><text class="t" x="824" y="162">blood</text><text class="s" x="796" y="188">water-soluble fuel</text>
  <path class="arrow" d="M214 172 H274"/><path class="arrow" d="M448 172 H508"/><path class="arrow" d="M702 172 H762"/>
  <rect class="blue" x="172" y="330" width="180" height="74" rx="14"/><text class="t" x="234" y="362">brain</text><text class="s" x="205" y="386">uses ketones</text>
  <rect class="blue" x="400" y="330" width="180" height="74" rx="14"/><text class="t" x="456" y="362">muscle</text><text class="s" x="433" y="386">uses ketones</text>
  <rect class="blue" x="628" y="330" width="180" height="74" rx="14"/><text class="t" x="686" y="362">heart</text><text class="s" x="661" y="386">uses ketones</text>
  <path class="arrow" d="M850 216 C820 278 704 310 718 326"/><path class="arrow" d="M850 216 C742 286 510 300 492 326"/><path class="arrow" d="M850 216 C674 278 276 292 262 326"/>
  <text class="s" x="44" y="464">Oddity: the liver produces ketones but cannot consume them.</text>
  <text class="s" x="44" y="486">Hepatocytes lack SCOT/thiophorase, the enzyme needed to use ketones.</text>
</svg>
