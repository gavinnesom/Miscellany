<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">ATP to muscle force</title><desc id="desc">Multiscale chain from ATP-powered myosin to sarcomere shortening and lifting a load.</desc><rect width="1120" height="620" fill="transparent"/><style>
.title{font:700 30px Georgia,serif;fill:#1d252d}.h{font:800 18px system-ui,sans-serif;fill:#1d252d}.s{font:600 14px system-ui,sans-serif;fill:#596774}.m{font:800 15px ui-monospace,Menlo,monospace;fill:#005fb8}.panel{fill:#fff;stroke:#d6e0e8;stroke-width:2}.soft{fill:#edf4fa;stroke:#d6e0e8;stroke-width:1.5}.blue{fill:#e7f3ff;stroke:#005fb8;stroke-width:2.5}.teal{fill:#dff0ff;stroke:#247a8a;stroke-width:2.5}.warn{fill:#fff;stroke:#b44747;stroke-width:2}.arrow{fill:none;stroke:#005fb8;stroke-width:3;stroke-linecap:round;marker-end:url(#a)}.thin{fill:none;stroke:#247a8a;stroke-width:2.5;stroke-linecap:round;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#005fb8"/></marker></defs>
<text class="title" x="50" y="55">From ATP to a lifted weight</text><text class="s" x="50" y="82">Calcium permits contraction; ATP-powered myosin supplies the motor cycle.</text>
<rect class="blue" x="54" y="210" width="138" height="82" rx="18"/><text class="h" x="123" y="242" text-anchor="middle">ATP + myosin</text><text class="s" x="123" y="266" text-anchor="middle">chemical input</text><path class="arrow" d="M192 251 H230"/><rect class="teal" x="230" y="210" width="138" height="82" rx="18"/><text class="h" x="299" y="242" text-anchor="middle">actin sliding</text><text class="s" x="299" y="266" text-anchor="middle">filaments move</text><path class="arrow" d="M368 251 H406"/><rect class="blue" x="406" y="210" width="138" height="82" rx="18"/><text class="h" x="475" y="242" text-anchor="middle">sarcomere shortens</text><text class="s" x="475" y="266" text-anchor="middle">Z-lines closer</text><path class="arrow" d="M544 251 H582"/><rect class="teal" x="582" y="210" width="138" height="82" rx="18"/><text class="h" x="651" y="242" text-anchor="middle">muscle fiber</text><text class="s" x="651" y="266" text-anchor="middle">many sarcomeres</text><path class="arrow" d="M720 251 H758"/><rect class="blue" x="758" y="210" width="138" height="82" rx="18"/><text class="h" x="827" y="242" text-anchor="middle">tendon + bone</text><text class="s" x="827" y="266" text-anchor="middle">lever transmits force</text><path class="arrow" d="M896 251 H934"/><rect class="teal" x="934" y="210" width="138" height="82" rx="18"/><text class="h" x="1003" y="242" text-anchor="middle">100-lb load rises</text><text class="s" x="1003" y="266" text-anchor="middle">external work</text>
<rect class="soft" x="100" y="370" width="920" height="58" rx="20"/><text class="s" x="560" y="394" text-anchor="middle">myosin heads → cross-bridges → myofibrils → fibers → tendon → bone/joint → external object</text><text class="m" x="560" y="418" text-anchor="middle">100 lb ≈ 45.36 kg; raising 1 m requires about 445 J external gravitational work</text>
<rect class="panel" x="220" y="480" width="680" height="54" rx="18"/><text class="s" x="560" y="512" text-anchor="middle">Ca²⁺ is the regulatory signal; ATP is the chemical input to the myosin cycle.</text></svg>
