<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Cambrian Explosion</title>
  <desc id="desc">Explanatory visual for Cambrian Explosion.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e9eff"/></marker>
  </defs>
  <rect width="960" height="540" fill="transparent"/>
  <text x="48" y="54" text-anchor="start" font-size="28" font-weight="700" fill="#1d252d"><tspan x="48" dy="0">Cambrian Explosion</tspan></text>
  <line x1="80" y1="285" x2="880" y2="285" stroke="#2e9eff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="105" cy="285" r="14" fill="#247a8a" stroke="#fff" stroke-width="4"/>
<line x1="105" y1="235" x2="105" y2="335" stroke="#d6e0e8" stroke-width="2" stroke-linecap="round"/>
<text x="105" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#1d252d"><tspan x="105" dy="0">635 Ma</tspan></text>
<text x="105" y="361" text-anchor="middle" font-size="16" font-weight="500" fill="#596774"><tspan x="105" dy="0">Ediacaran fauna</tspan></text>
<circle cx="355" cy="285" r="14" fill="#2e9eff" stroke="#fff" stroke-width="4"/>
<line x1="355" y1="235" x2="355" y2="335" stroke="#d6e0e8" stroke-width="2" stroke-linecap="round"/>
<text x="355" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#1d252d"><tspan x="355" dy="0">541 Ma</tspan></text>
<text x="355" y="361" text-anchor="middle" font-size="16" font-weight="500" fill="#596774"><tspan x="355" dy="0">Cambrian boundary</tspan></text>
<circle cx="605" cy="285" r="14" fill="#005fb8" stroke="#fff" stroke-width="4"/>
<line x1="605" y1="235" x2="605" y2="335" stroke="#d6e0e8" stroke-width="2" stroke-linecap="round"/>
<text x="605" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#1d252d"><tspan x="605" dy="0">520 Ma</tspan></text>
<text x="605" y="361" text-anchor="middle" font-size="16" font-weight="500" fill="#596774"><tspan x="605" dy="0">many body plans</tspan></text>
<circle cx="855" cy="285" r="14" fill="#596774" stroke="#fff" stroke-width="4"/>
<line x1="855" y1="235" x2="855" y2="335" stroke="#d6e0e8" stroke-width="2" stroke-linecap="round"/>
<text x="855" y="207" text-anchor="middle" font-size="18" font-weight="700" fill="#1d252d"><tspan x="855" dy="0">485 Ma</tspan></text>
<text x="855" y="361" text-anchor="middle" font-size="16" font-weight="500" fill="#596774"><tspan x="855" dy="0">Cambrian ends</tspan></text>
</svg>
