<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Crossbridge cycle schematic</title><desc id="desc">Simplified actomyosin cycle from ATP binding through detachment, priming, attachment, working stroke and ADP release.</desc><rect width="1120" height="620" fill="transparent"/><style>
.title{font:700 30px Georgia,serif;fill:#1d252d}.h{font:800 18px system-ui,sans-serif;fill:#1d252d}.s{font:600 14px system-ui,sans-serif;fill:#596774}.m{font:800 15px ui-monospace,Menlo,monospace;fill:#005fb8}.panel{fill:#fff;stroke:#d6e0e8;stroke-width:2}.soft{fill:#edf4fa;stroke:#d6e0e8;stroke-width:1.5}.blue{fill:#e7f3ff;stroke:#005fb8;stroke-width:2.5}.teal{fill:#dff0ff;stroke:#247a8a;stroke-width:2.5}.warn{fill:#fff;stroke:#b44747;stroke-width:2}.arrow{fill:none;stroke:#005fb8;stroke-width:3;stroke-linecap:round;marker-end:url(#a)}.thin{fill:none;stroke:#247a8a;stroke-width:2.5;stroke-linecap:round;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#005fb8"/></marker></defs>
<text class="title" x="50" y="55">Simplified actin–myosin crossbridge cycle</text><text class="s" x="50" y="82">Lymn–Taylor-style schematic; multiple biochemical substates omitted.</text>
<rect class="blue" x="478" y="108" width="164" height="84" rx="18"/><text class="h" x="560" y="142" text-anchor="middle">1 ATP binds</text><text class="s" x="560" y="168" text-anchor="middle">detach</text><rect class="blue" x="725.27469423674" y="225.46711095625892" width="164" height="84" rx="18"/><text class="h" x="807.27469423674" y="259.4671109562589" text-anchor="middle">2 hydrolysis</text><text class="s" x="807.27469423674" y="285.4671109562589" text-anchor="middle">prime</text><rect class="blue" x="630.824165596043" y="415.5328890437411" width="164" height="84" rx="18"/><text class="h" x="712.824165596043" y="449.5328890437411" text-anchor="middle">3 attach</text><text class="s" x="712.824165596043" y="475.5328890437411" text-anchor="middle">actin available</text><rect class="teal" x="325.175834403957" y="415.5328890437411" width="164" height="84" rx="18"/><text class="h" x="407.175834403957" y="449.5328890437411" text-anchor="middle">4 working stroke</text><text class="s" x="407.175834403957" y="475.5328890437411" text-anchor="middle">product release</text><rect class="blue" x="230.72530576326005" y="225.46711095625886" width="164" height="84" rx="18"/><text class="h" x="312.72530576326005" y="259.46711095625886" text-anchor="middle">5 ADP leaves</text><text class="s" x="312.72530576326005" y="285.46711095625886" text-anchor="middle">strong state</text>
<path class="arrow" d="M610 160 C760 180 836 260 804 372"/><path class="arrow" d="M758 438 C645 535 476 531 374 432"/><path class="arrow" d="M316 372 C280 250 352 176 510 160"/><text class="s" x="560" y="582" text-anchor="middle">ATP binding promotes detachment; chemical-state changes bias the motor toward force-generating motion.</text></svg>
