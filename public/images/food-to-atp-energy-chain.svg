<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Food to ATP energy chain</title><desc id="desc">Mechanism from fuels through electron transport, proton gradient, ATP synthase and cellular work.</desc><rect width="1120" height="620" fill="transparent"/><style>
.title{font:700 30px Georgia,serif;fill:#1d252d}.h{font:800 18px system-ui,sans-serif;fill:#1d252d}.s{font:600 14px system-ui,sans-serif;fill:#596774}.m{font:800 15px ui-monospace,Menlo,monospace;fill:#005fb8}.panel{fill:#fff;stroke:#d6e0e8;stroke-width:2}.soft{fill:#edf4fa;stroke:#d6e0e8;stroke-width:1.5}.blue{fill:#e7f3ff;stroke:#005fb8;stroke-width:2.5}.teal{fill:#dff0ff;stroke:#247a8a;stroke-width:2.5}.warn{fill:#fff;stroke:#b44747;stroke-width:2}.arrow{fill:none;stroke:#005fb8;stroke-width:3;stroke-linecap:round;marker-end:url(#a)}.thin{fill:none;stroke:#247a8a;stroke-width:2.5;stroke-linecap:round;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#005fb8"/></marker></defs>
<text class="title" x="50" y="55">From food molecules to ATP</text><text class="s" x="50" y="82">Oxidation releases energy through controlled electron transfer and a proton gradient.</text>
<rect class="panel" x="70" y="135" width="980" height="300" rx="20"/><rect class="soft" x="128" y="188" width="770" height="116" rx="22"/><text class="h" x="512" y="177" text-anchor="middle">inner mitochondrial membrane</text>
<rect class="blue" x="100" y="92" width="132" height="42" rx="12"/><text class="h" x="166" y="119" text-anchor="middle">carb</text><rect class="blue" x="100" y="172" width="132" height="42" rx="12"/><text class="h" x="166" y="199" text-anchor="middle">fat</text><rect class="blue" x="100" y="252" width="132" height="42" rx="12"/><text class="h" x="166" y="279" text-anchor="middle">ketones</text>
<path class="arrow" d="M232 174 H334"/><path class="arrow" d="M232 254 H334"/><rect class="teal" x="334" y="178" width="154" height="82" rx="16"/><text class="h" x="411" y="210" text-anchor="middle">acetyl-CoA</text><text class="s" x="411" y="234" text-anchor="middle">central oxidation</text><path class="arrow" d="M488 219 H590"/><rect class="blue" x="590" y="178" width="138" height="82" rx="16"/><text class="h" x="659" y="210" text-anchor="middle">NADH</text><text class="h" x="659" y="234" text-anchor="middle">FADH₂</text><path class="arrow" d="M728 219 H820"/><rect class="teal" x="820" y="158" width="126" height="122" rx="18"/><text class="h" x="883" y="194" text-anchor="middle">ETC</text><text class="s" x="883" y="218" text-anchor="middle">pumps H⁺</text><text class="s" x="883" y="242" text-anchor="middle">O₂ → H₂O</text>
<text class="m" x="496" y="146" text-anchor="middle">H⁺ H⁺ H⁺ H⁺</text><path class="thin" d="M866 158 C854 120 786 112 710 130"/><rect class="soft" x="760" y="324" width="144" height="62" rx="16"/><text class="h" x="832" y="350" text-anchor="middle">ATP synthase</text><text class="s" x="832" y="372" text-anchor="middle">H⁺ return drives rotation</text><path class="arrow" d="M904 355 H984"/><rect class="blue" x="984" y="328" width="64" height="54" rx="13"/><text class="h" x="1016" y="361" text-anchor="middle">ATP</text><path class="arrow" d="M1016 382 V470"/><rect class="teal" x="930" y="470" width="172" height="52" rx="16"/><text class="h" x="1016" y="502" text-anchor="middle">cellular work</text><rect class="soft" x="92" y="470" width="430" height="42" rx="21"/><text class="s" x="307" y="496" text-anchor="middle">Glycolysis also makes some ATP directly before the mitochondrial chain.</text></svg>
