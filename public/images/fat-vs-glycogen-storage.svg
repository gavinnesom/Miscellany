<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Fat versus glycogen storage</title><desc id="desc">Quantitative energy-density comparison with glycogen hydration caveat.</desc><rect width="1120" height="620" fill="transparent"/><style>
.title{font:700 30px Georgia,serif;fill:#1d252d}.h{font:800 18px system-ui,sans-serif;fill:#1d252d}.s{font:600 14px system-ui,sans-serif;fill:#596774}.m{font:800 15px ui-monospace,Menlo,monospace;fill:#005fb8}.panel{fill:#fff;stroke:#d6e0e8;stroke-width:2}.soft{fill:#edf4fa;stroke:#d6e0e8;stroke-width:1.5}.blue{fill:#e7f3ff;stroke:#005fb8;stroke-width:2.5}.teal{fill:#dff0ff;stroke:#247a8a;stroke-width:2.5}.warn{fill:#fff;stroke:#b44747;stroke-width:2}.arrow{fill:none;stroke:#005fb8;stroke-width:3;stroke-linecap:round;marker-end:url(#a)}.thin{fill:none;stroke:#247a8a;stroke-width:2.5;stroke-linecap:round;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#005fb8"/></marker></defs>
<text class="title" x="50" y="55">Fat is compact; glycogen is fast and hydrated</text><text class="s" x="50" y="82">Food-label factors and an illustrative biological storage comparison.</text>
<rect class="panel" x="70" y="125" width="300" height="360" rx="18"/><text class="h" x="220" y="164" text-anchor="middle">DRY NUTRIENT</text><rect class="blue" x="130" y="220" width="96" height="34" rx="8"/><text class="s" x="246" y="242">carb 4 kcal/g</text><rect class="teal" x="130" y="292" width="216" height="34" rx="8"/><text class="s" x="130" y="350">fat 9 kcal/g</text>
<rect class="panel" x="410" y="125" width="330" height="360" rx="18"/><text class="h" x="575" y="164" text-anchor="middle">ILLUSTRATIVE STORAGE</text><rect class="blue" x="470" y="214" width="70" height="54" rx="10"/><text class="m" x="505" y="246" text-anchor="middle">1 g</text><rect class="soft" x="540" y="214" width="170" height="54" rx="10"/><text class="s" x="625" y="246" text-anchor="middle">≥3 g associated water</text><text class="s" x="575" y="310" text-anchor="middle">4 kcal over ≥4 g package</text><text class="m" x="575" y="340" text-anchor="middle">≤ ~1 kcal/g illustrative package</text><text class="s" x="575" y="386" text-anchor="middle">not a direct tissue-density measurement</text>
<rect class="panel" x="780" y="125" width="270" height="360" rx="18"/><text class="h" x="915" y="164" text-anchor="middle">WHY KEEP GLYCOGEN?</text><text class="s" x="915" y="222" text-anchor="middle">rapid local access</text><text class="s" x="915" y="266" text-anchor="middle">glycolytic ATP</text><text class="s" x="915" y="310" text-anchor="middle">high-intensity contribution</text><rect class="soft" x="824" y="356" width="182" height="48" rx="16"/><text class="s" x="915" y="386" text-anchor="middle">density is not power delivery</text></svg>
