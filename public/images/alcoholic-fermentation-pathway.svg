<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Alcoholic fermentation pathway</title><desc id="desc">Glucose becomes pyruvate, acetaldehyde and ethanol while NAD plus is regenerated.</desc><rect width="1120" height="620" fill="transparent"/><style>
.title{font:700 30px Georgia,serif;fill:#1d252d}.h{font:800 18px system-ui,sans-serif;fill:#1d252d}.s{font:600 14px system-ui,sans-serif;fill:#596774}.m{font:800 15px ui-monospace,Menlo,monospace;fill:#005fb8}.panel{fill:#fff;stroke:#d6e0e8;stroke-width:2}.soft{fill:#edf4fa;stroke:#d6e0e8;stroke-width:1.5}.blue{fill:#e7f3ff;stroke:#005fb8;stroke-width:2.5}.teal{fill:#dff0ff;stroke:#247a8a;stroke-width:2.5}.warn{fill:#fff;stroke:#b44747;stroke-width:2}.arrow{fill:none;stroke:#005fb8;stroke-width:3;stroke-linecap:round;marker-end:url(#a)}.thin{fill:none;stroke:#247a8a;stroke-width:2.5;stroke-linecap:round;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#005fb8"/></marker></defs>
<text class="title" x="50" y="55">Alcoholic fermentation keeps glycolysis running</text><text class="s" x="50" y="82">Ethanol is visible; NAD⁺ recycling is the metabolic trick.</text>
<g transform="translate(62 136)"><rect class="blue" x="0" y="94" width="126" height="62" rx="16"/><text class="h" x="63" y="119" text-anchor="middle">glucose</text><text class="m" x="63" y="142" text-anchor="middle">6C</text>
<path class="arrow" d="M126 125 H226"/><rect class="soft" x="226" y="76" width="152" height="98" rx="16"/><text class="h" x="302" y="110" text-anchor="middle">glycolysis</text><text class="m" x="302" y="134" text-anchor="middle">net 2 ATP</text><text class="m" x="302" y="156" text-anchor="middle">NAD⁺ → NADH</text>
<path class="arrow" d="M378 125 H470"/><rect class="blue" x="470" y="94" width="126" height="62" rx="16"/><text class="h" x="533" y="119" text-anchor="middle">2 pyruvate</text><text class="m" x="533" y="142" text-anchor="middle">3C each</text>
<path class="arrow" d="M596 125 H690"/><rect class="blue" x="690" y="86" width="150" height="78" rx="16"/><text class="h" x="765" y="113" text-anchor="middle">2 acetaldehyde</text><text class="m" x="765" y="137" text-anchor="middle">2C each</text><text class="s" x="765" y="159" text-anchor="middle">2 CO₂ released</text>
<path class="arrow" d="M840 125 H928"/><rect class="teal" x="928" y="94" width="126" height="62" rx="16"/><text class="h" x="991" y="119" text-anchor="middle">2 ethanol</text><text class="m" x="991" y="142" text-anchor="middle">2C each</text>
<path class="thin" d="M820 202 C875 252 927 252 982 202"/><text class="m" x="900" y="246" text-anchor="middle">NADH → NAD⁺</text>
<rect class="panel" x="120" y="300" width="780" height="92" rx="18"/><text class="h" x="510" y="331" text-anchor="middle">sugar access before yeast</text><text class="s" x="314" y="365" text-anchor="middle">fruit / honey: fermentable sugars ready</text><text class="s" x="694" y="365" text-anchor="middle">grain / rice: starch → saccharification first</text></g></svg>
