<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Cardiovascular System Map</title>
<desc id="desc">Heart, vessels, resistance, exchange, venous return, and systemic pressure drop.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9eff"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:28px;font-weight:700;fill:#1d252d}.l{font-size:18px;font-weight:650;fill:#1d252d}.s{font-size:14px;fill:#596774}.eq{font-size:17px;font-weight:650;fill:#005fb8}</style></defs>
<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">Cardiovascular System Map</text>
<rect x="46" y="82" width="1028" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><g transform="translate(72 118)"><ellipse cx="150" cy="150" rx="58" ry="72" fill="#fff1f2" stroke="#c2410c" stroke-width="3"/><text x="150" y="142" text-anchor="middle" class="l">heart</text><text x="150" y="166" text-anchor="middle" class="s">pump</text><ellipse cx="152" cy="42" rx="82" ry="32" fill="#eaf8f7" stroke="#0b8f8a" stroke-width="3"/><text x="152" y="48" text-anchor="middle" class="l">lungs</text><line x1="150" y1="88" x2="150" y2="72" stroke="#0b8f8a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="210" y1="150" x2="352" y2="150" stroke="#c2410c" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M352 150 C420 104 498 104 560 150" fill="none" stroke="#c2410c" stroke-width="18" stroke-linecap="round"/><path d="M560 150 C620 150 672 150 730 150" fill="none" stroke="#b98519" stroke-width="12" stroke-linecap="round"/><path d="M730 150 C812 110 880 110 944 150" fill="none" stroke="#0b8f8a" stroke-width="10" stroke-linecap="round"/><path d="M944 150 C800 290 410 292 210 190" fill="none" stroke="#005fb8" stroke-width="14" stroke-linecap="round"/><line x1="336" y1="150" x2="438" y2="135" stroke="#c2410c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="552" y1="150" x2="672" y2="150" stroke="#b98519" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="740" y1="150" x2="850" y2="132" stroke="#0b8f8a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="660" y1="270" x2="286" y2="210" stroke="#005fb8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="438" y="94" text-anchor="middle" class="l">arteries</text><text x="438" y="118" text-anchor="middle" class="s">elastic pressure conduits</text><text x="642" y="94" text-anchor="middle" class="l">arterioles</text><text x="642" y="118" text-anchor="middle" class="s">major resistance drop</text><text x="844" y="94" text-anchor="middle" class="l">capillaries</text><text x="844" y="118" text-anchor="middle" class="s">exchange area</text><text x="572" y="316" text-anchor="middle" class="l">veins: low-pressure return reservoir</text><g transform="translate(270 330)"><line x1="0" y1="80" x2="660" y2="80" stroke="#1d252d"/><line x1="0" y1="80" x2="0" y2="5" stroke="#1d252d"/><path d="M0 16 L180 24 L360 62 L500 74 L660 78" fill="none" stroke="#005fb8" stroke-width="5"/><rect x="205" y="20" width="150" height="52" fill="#fff0c7" opacity="0.9"/><text x="330" y="108" text-anchor="middle" class="s">arteries → arterioles → capillaries → veins</text><text x="282" y="54" text-anchor="middle" class="eq">largest pressure drop</text></g></g>
</svg>
