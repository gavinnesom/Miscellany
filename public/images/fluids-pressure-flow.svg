<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Fluids: Pressure, Buoyancy, and Flow</title>
<desc id="desc">Tank, constricted pipe, pressure gauges, velocity arrows and buoyancy pressure difference.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9eff"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:28px;font-weight:700;fill:#1d252d}.l{font-size:18px;font-weight:650;fill:#1d252d}.s{font-size:14px;fill:#596774}.eq{font-size:17px;font-weight:650;fill:#005fb8}</style></defs>
<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">Fluids: Pressure, Buoyancy, and Flow</text>
<rect x="48" y="82" width="1024" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><g transform="translate(78 116)"><rect x="0" y="40" width="190" height="230" fill="#eaf8f7" stroke="#0b8f8a" stroke-width="3"/><path d="M190 170 H390 V135 H560 V170 H720" fill="none" stroke="#0b8f8a" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/><path d="M190 170 H390 V135 H560 V170 H720" fill="none" stroke="#0b8f8a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="250" y1="170" x2="335" y2="170" stroke="#005fb8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="430" y1="135" x2="530" y2="135" stroke="#c2410c" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="590" y1="170" x2="690" y2="170" stroke="#005fb8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="285" y1="170" x2="285" y2="96" stroke="#b98519" stroke-width="4"/><line x1="470" y1="135" x2="470" y2="112" stroke="#b98519" stroke-width="4"/><line x1="630" y1="170" x2="630" y2="104" stroke="#b98519" stroke-width="4"/><text x="470" y="82" text-anchor="middle" class="l">narrower pipe: faster flow, lower static pressure in ideal Bernoulli case</text><text x="92" y="300" text-anchor="middle" class="eq">P=P₀+ρgh</text><text x="472" y="222" text-anchor="middle" class="eq">A₁v₁=A₂v₂</text></g><g transform="translate(820 168)"><rect x="0" y="0" width="180" height="220" rx="8" fill="#f6fbff" stroke="#d6e0e8"/><rect x="58" y="88" width="64" height="58" fill="#fff8e8" stroke="#b98519"/><line x1="90" y1="88" x2="90" y2="50" stroke="#c2410c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="90" y1="146" x2="90" y2="196" stroke="#005fb8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="90" y="36" text-anchor="middle" class="s">top pressure</text><text x="90" y="214" text-anchor="middle" class="s">larger bottom pressure</text><text x="90" y="176" text-anchor="middle" class="eq">FB up</text></g>
