<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Metabolic fuel use as a portfolio</title><desc id="desc">Glucose, fatty acids, ketones and amino acids enter ATP-generating pathways in different ways.</desc><rect width="1120" height="620" fill="transparent"/><style>
.title{font:700 30px Georgia,serif;fill:#1d252d}.h{font:800 18px system-ui,sans-serif;fill:#1d252d}.s{font:600 14px system-ui,sans-serif;fill:#596774}.m{font:800 15px ui-monospace,Menlo,monospace;fill:#005fb8}.panel{fill:#fff;stroke:#d6e0e8;stroke-width:2}.soft{fill:#edf4fa;stroke:#d6e0e8;stroke-width:1.5}.blue{fill:#e7f3ff;stroke:#005fb8;stroke-width:2.5}.teal{fill:#dff0ff;stroke:#247a8a;stroke-width:2.5}.warn{fill:#fff;stroke:#b44747;stroke-width:2}.arrow{fill:none;stroke:#005fb8;stroke-width:3;stroke-linecap:round;marker-end:url(#a)}.thin{fill:none;stroke:#247a8a;stroke-width:2.5;stroke-linecap:round;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#005fb8"/></marker></defs>
<text class="title" x="50" y="55">Fuel selection is a portfolio, not a switch</text><text class="s" x="50" y="82">Relative contribution changes with tissue, state, oxygen delivery and intensity.</text>
<g transform="translate(74 130)"><rect class="blue" x="0" y="28" width="190" height="62" rx="16"/><text class="h" x="95" y="55" text-anchor="middle">glucose / glycogen</text><text class="s" x="95" y="78" text-anchor="middle">rapid carbohydrate</text><rect class="blue" x="0" y="148" width="190" height="62" rx="16"/><text class="h" x="95" y="184" text-anchor="middle">fatty acids</text><rect class="blue" x="0" y="268" width="190" height="62" rx="16"/><text class="h" x="95" y="304" text-anchor="middle">ketones</text><rect class="soft" x="0" y="388" width="190" height="62" rx="16"/><text class="h" x="95" y="414" text-anchor="middle">amino acids</text><text class="s" x="95" y="436" text-anchor="middle">multiple entry points</text>
<rect class="teal" x="350" y="116" width="230" height="108" rx="20"/><text class="h" x="465" y="150" text-anchor="middle">mitochondrial carbon</text><text class="h" x="465" y="174" text-anchor="middle">and electron flow</text><text class="s" x="465" y="200" text-anchor="middle">NADH/FADH₂ → gradient</text><rect class="teal" x="730" y="140" width="144" height="68" rx="18"/><text class="h" x="802" y="180" text-anchor="middle">ATP</text>
<path class="arrow" d="M190 59 C270 65 312 102 350 130"/><path class="arrow" d="M190 179 H350"/><path class="arrow" d="M190 299 C270 292 312 238 350 206"/><path class="arrow" d="M580 170 H730"/><path class="thin" d="M190 59 C260 112 245 245 350 292"/><rect class="soft" x="350" y="262" width="230" height="70" rx="16"/><text class="h" x="465" y="290" text-anchor="middle">glycolysis</text><text class="s" x="465" y="312" text-anchor="middle">some ATP before mitochondria</text></g>
<rect class="soft" x="188" y="548" width="744" height="40" rx="20"/><text class="s" x="560" y="573" text-anchor="middle">No universal toggle: the mix shifts with hormones, workload, substrate availability and cell machinery.</text></svg>
