<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Gluconeogenesis carbon sources</title>
  <desc id="desc">Lactate, glycerol, and glucogenic amino acids feed liver and kidney glucose production.</desc>
  <rect width="980" height="520" fill="transparent"/>
  <style>.h{font:700 28px Georgia,serif;fill:#1d252d}.t{font:600 18px system-ui,sans-serif;fill:#1d252d}.s{font:15px system-ui,sans-serif;fill:#596774}.box{fill:#edf4fa;stroke:#d6e0e8;stroke-width:2}.green{fill:#dff0ff;stroke:#247a8a;stroke-width:2}.blue{fill:#e7f3ff;stroke:#2e9eff;stroke-width:2}.arrow{stroke:#004f99;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#004f99"/></marker></defs>
  <text class="h" x="44" y="58">gluconeogenesis: making new glucose</text>
  <rect class="box" x="62" y="124" width="190" height="78" rx="14"/><text class="t" x="126" y="156">lactate</text><text class="s" x="100" y="180">Cori cycle return</text>
  <rect class="box" x="62" y="232" width="190" height="78" rx="14"/><text class="t" x="124" y="264">glycerol</text><text class="s" x="95" y="288">from triglycerides</text>
  <rect class="box" x="62" y="340" width="190" height="78" rx="14"/><text class="t" x="88" y="372">amino acids</text><text class="s" x="92" y="396">especially alanine</text>
  <rect class="green" x="390" y="182" width="210" height="150" rx="18"/><text class="t" x="452" y="222">liver</text><text class="s" x="430" y="250">major site</text><text class="t" x="444" y="292">kidney</text><text class="s" x="418" y="316">more in prolonged fast</text>
  <rect class="blue" x="738" y="218" width="180" height="88" rx="14"/><text class="t" x="796" y="252">glucose</text><text class="s" x="768" y="278">released to blood</text>
  <path class="arrow" d="M252 163 C310 170 338 210 386 226"/><path class="arrow" d="M252 271 H386"/><path class="arrow" d="M252 379 C320 360 338 312 386 298"/><path class="arrow" d="M600 260 H734"/>
  <text class="s" x="44" y="474">Even-chain fatty acids do not yield net glucose; the glycerol backbone of triglyceride can.</text>
</svg>
