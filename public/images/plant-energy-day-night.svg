<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Plant energy day and night</title><desc id="desc">Plant diagram showing daytime starch accumulation, nighttime starch use and rationing toward dawn.</desc><rect width="1120" height="620" fill="transparent"/><style>
.title{font:700 30px Georgia,serif;fill:#1d252d}.h{font:800 18px system-ui,sans-serif;fill:#1d252d}.s{font:600 14px system-ui,sans-serif;fill:#596774}.m{font:800 15px ui-monospace,Menlo,monospace;fill:#005fb8}.panel{fill:#fff;stroke:#d6e0e8;stroke-width:2}.soft{fill:#edf4fa;stroke:#d6e0e8;stroke-width:1.5}.blue{fill:#e7f3ff;stroke:#005fb8;stroke-width:2.5}.teal{fill:#dff0ff;stroke:#247a8a;stroke-width:2.5}.warn{fill:#fff;stroke:#b44747;stroke-width:2}.arrow{fill:none;stroke:#005fb8;stroke-width:3;stroke-linecap:round;marker-end:url(#a)}.thin{fill:none;stroke:#247a8a;stroke-width:2.5;stroke-linecap:round;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#005fb8"/></marker></defs>
<text class="title" x="50" y="55">Plants budget carbon across the night</text><text class="s" x="50" y="82">Photosynthesis supplies fixed carbon by day; respiration continues day and night.</text>
<rect class="panel" x="62" y="120" width="470" height="240" rx="18"/><text class="h" x="297" y="154" text-anchor="middle">DAY</text><circle class="teal" cx="150" cy="220" r="38"/><text class="h" x="150" y="226" text-anchor="middle">sun</text><path class="arrow" d="M190 220 H270"/><rect class="blue" x="270" y="188" width="150" height="64" rx="16"/><text class="h" x="345" y="214" text-anchor="middle">chloroplast</text><text class="s" x="345" y="236" text-anchor="middle">fix carbon</text><path class="arrow" d="M345 252 V300"/><text class="s" x="345" y="324" text-anchor="middle">sucrose export + starch grows</text>
<rect class="panel" x="588" y="120" width="470" height="240" rx="18"/><text class="h" x="823" y="154" text-anchor="middle">NIGHT</text><rect class="blue" x="650" y="190" width="130" height="62" rx="16"/><text class="h" x="715" y="216" text-anchor="middle">starch</text><text class="s" x="715" y="238" text-anchor="middle">shrinks</text><path class="arrow" d="M780 220 H858"/><rect class="teal" x="858" y="190" width="136" height="62" rx="16"/><text class="h" x="926" y="216" text-anchor="middle">mitochondria</text><text class="s" x="926" y="238" text-anchor="middle">ATP</text><text class="s" x="823" y="322" text-anchor="middle">no photosynthetic light input; respiration still occurs</text>
<rect class="panel" x="120" y="410" width="880" height="132" rx="18"/><line x1="190" y1="500" x2="910" y2="500" stroke="#d6e0e8" stroke-width="2"/><line x1="190" y1="440" x2="190" y2="500" stroke="#d6e0e8" stroke-width="2"/><path d="M190 448 L910 498" stroke="#005fb8" stroke-width="4" fill="none"/><path d="M320 448 L910 498" stroke="#247a8a" stroke-width="3" stroke-dasharray="8 7" fill="none"/><text class="s" x="190" y="524" text-anchor="middle">dusk</text><text class="s" x="910" y="524" text-anchor="middle">dawn</text><text class="s" x="550" y="458" text-anchor="middle">rate behaves like starch remaining ÷ expected time to dawn</text></svg>
