<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Sleep architecture across a night</title>
  <desc id="desc">Hypnogram-style diagram with labeled shaded regions for early N3-rich sleep and later REM-rich sleep.</desc>
  <rect width="1040" height="560" fill="transparent"/>
  <style>
    .h{font:700 28px Georgia,serif;fill:#1d252d}
    .t{font:700 16px system-ui,sans-serif;fill:#1d252d}
    .s{font:600 13px system-ui,sans-serif;fill:#596774}
    .grid{stroke:#d6e0e8;stroke-width:1}
    .line{fill:none;stroke:#005fb8;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
    .rem{fill:#2e9eff;opacity:.28}
    .deep{fill:#247a8a;opacity:.18}
    .legend{fill:#ffffff;stroke:#d6e0e8;stroke-width:1.5}
  </style>
  <text class="h" x="44" y="58">sleep cycles are asymmetric across the night</text>
  <text class="s" x="44" y="92">Shading is labeled: green = early-night N3/deep-sleep emphasis; gold = REM episodes, longer later.</text>
  <g transform="translate(92 136)">
    <line class="grid" x1="0" y1="0" x2="840" y2="0"/><line class="grid" x1="0" y1="70" x2="840" y2="70"/><line class="grid" x1="0" y1="140" x2="840" y2="140"/><line class="grid" x1="0" y1="210" x2="840" y2="210"/><line class="grid" x1="0" y1="280" x2="840" y2="280"/>
    <text class="t" x="-58" y="5">wake</text><text class="t" x="-40" y="75">REM</text><text class="t" x="-34" y="145">N1</text><text class="t" x="-34" y="215">N2</text><text class="t" x="-34" y="285">N3</text>
    <rect class="deep" x="84" y="220" width="110" height="60" rx="8"/><rect class="deep" x="250" y="220" width="92" height="60" rx="8"/><rect class="deep" x="424" y="232" width="50" height="48" rx="8"/>
    <text class="s" x="238" y="304" text-anchor="middle">early N3/deep sleep emphasis</text>
    <rect class="rem" x="188" y="42" width="54" height="56" rx="8"/><rect class="rem" x="354" y="34" width="76" height="64" rx="8"/><rect class="rem" x="524" y="26" width="108" height="72" rx="8"/><rect class="rem" x="700" y="18" width="132" height="80" rx="8"/>
    <text class="s" x="690" y="118" text-anchor="middle">REM episodes lengthen later</text>
    <polyline class="line" points="0,0 42,140 84,210 124,280 176,210 206,70 242,210 286,280 332,210 392,70 430,210 474,260 522,210 578,70 632,210 684,140 734,70 790,140 840,0"/>
    <text class="s" x="0" y="342">sleep onset</text><text class="s" x="724" y="342">morning</text>
  </g>
  <g transform="translate(92 490)">
    <rect class="legend" width="650" height="42" rx="8"/>
    <rect class="deep" x="16" y="11" width="36" height="20" rx="4"/>
    <text class="s" x="64" y="26">N3-rich portions of early cycles</text>
    <rect class="rem" x="296" y="11" width="36" height="20" rx="4"/>
    <text class="s" x="344" y="26">REM periods, increasingly long toward morning</text>
  </g>
</svg>
