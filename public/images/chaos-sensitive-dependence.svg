<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Chaos Sensitive Dependence</title>
<desc id="desc">Two deterministic trajectories diverge and log separation grows.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9eff"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:28px;font-weight:700;fill:#1d252d}.l{font-size:18px;font-weight:650;fill:#1d252d}.s{font-size:14px;fill:#596774}.eq{font-size:17px;font-weight:650;fill:#005fb8}</style></defs>
<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">Chaos Sensitive Dependence</text>
<rect x="48" y="82" width="1024" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><g transform="translate(94 132)"><rect x="0" y="0" width="430" height="245" rx="8" fill="#f7fafc" stroke="#d6e0e8"/><path d="M30 188 C90 40 158 120 220 82 S330 28 390 140" fill="none" stroke="#005fb8" stroke-width="4"/><path d="M30 190 C92 42 158 121 220 84 S326 54 390 206" fill="none" stroke="#c2410c" stroke-width="4"/><text x="215" y="32" text-anchor="middle" class="l">same rule, tiny initial difference</text><text x="124" y="218" text-anchor="middle" class="s">early: nearly identical</text><text x="338" y="218" text-anchor="middle" class="s">later: diverged</text></g><g transform="translate(620 132)"><rect x="0" y="0" width="360" height="245" rx="8" fill="#f7fafc" stroke="#d6e0e8"/><line x1="42" y1="198" x2="315" y2="198" stroke="#1d252d"/><line x1="42" y1="198" x2="42" y2="36" stroke="#1d252d"/><path d="M54 186 L104 166 L154 137 L204 96 L254 70 L304 68" fill="none" stroke="#0b8f8a" stroke-width="5"/><text x="180" y="32" text-anchor="middle" class="l">log separation</text><text x="180" y="224" text-anchor="middle" class="s">linear region ≈ exponential growth</text><text x="180" y="96" text-anchor="middle" class="eq">|δX(t)| ~ |δX(0)|e^(λt)</text></g><text x="560" y="470" text-anchor="middle" class="eq">chaos is deterministic unpredictability, not randomness</text>
</svg>
