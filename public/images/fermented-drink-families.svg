<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Fermented drink families</title><desc id="desc">Beer, wine, cider, mead and sake compared by sugar availability and starch unlocking.</desc><rect width="1120" height="620" fill="transparent"/><style>
.title{font:700 30px Georgia,serif;fill:#1d252d}.h{font:800 18px system-ui,sans-serif;fill:#1d252d}.s{font:600 14px system-ui,sans-serif;fill:#596774}.m{font:800 15px ui-monospace,Menlo,monospace;fill:#005fb8}.panel{fill:#fff;stroke:#d6e0e8;stroke-width:2}.soft{fill:#edf4fa;stroke:#d6e0e8;stroke-width:1.5}.blue{fill:#e7f3ff;stroke:#005fb8;stroke-width:2.5}.teal{fill:#dff0ff;stroke:#247a8a;stroke-width:2.5}.warn{fill:#fff;stroke:#b44747;stroke-width:2}.arrow{fill:none;stroke:#005fb8;stroke-width:3;stroke-linecap:round;marker-end:url(#a)}.thin{fill:none;stroke:#247a8a;stroke-width:2.5;stroke-linecap:round;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#005fb8"/></marker></defs>
<text class="title" x="50" y="55">Fermented drinks differ before fermentation starts</text><text class="s" x="50" y="82">Fruit and honey offer sugars; grain and rice need starch unlocked.</text>
<rect class="panel" x="58" y="122" width="1004" height="178" rx="18"/><text class="h" x="90" y="156">SUGAR ALREADY AVAILABLE</text>
<rect class="blue" x="130" y="196" width="126" height="46" rx="13"/><text class="h" x="193" y="225" text-anchor="middle">grapes</text><path class="arrow" d="M256 219 H326"/><rect class="teal" x="326" y="196" width="104" height="46" rx="13"/><text class="h" x="378" y="225" text-anchor="middle">wine</text><rect class="blue" x="430" y="196" width="126" height="46" rx="13"/><text class="h" x="493" y="225" text-anchor="middle">apples</text><path class="arrow" d="M556 219 H626"/><rect class="teal" x="626" y="196" width="104" height="46" rx="13"/><text class="h" x="678" y="225" text-anchor="middle">cider</text><rect class="blue" x="730" y="196" width="126" height="46" rx="13"/><text class="h" x="793" y="225" text-anchor="middle">honey + water</text><path class="arrow" d="M856 219 H926"/><rect class="teal" x="926" y="196" width="104" height="46" rx="13"/><text class="h" x="978" y="225" text-anchor="middle">mead</text>
<rect class="panel" x="58" y="338" width="1004" height="178" rx="18"/><text class="h" x="90" y="372">STARCH MUST BE UNLOCKED</text>
<rect class="blue" x="154" y="416" width="96" height="46" rx="13"/><text class="h" x="202" y="445" text-anchor="middle">grain</text><path class="arrow" d="M250 439 H330"/><rect class="soft" x="330" y="404" width="160" height="70" rx="14"/><text class="h" x="410" y="431" text-anchor="middle">malt / mash</text><text class="s" x="410" y="453" text-anchor="middle">enzymes → sugars</text><path class="arrow" d="M490 439 H570"/><rect class="teal" x="570" y="416" width="96" height="46" rx="13"/><text class="h" x="618" y="445" text-anchor="middle">beer</text>
<rect class="blue" x="720" y="416" width="96" height="46" rx="13"/><text class="h" x="768" y="445" text-anchor="middle">rice</text><path class="arrow" d="M816 439 H876"/><rect class="soft" x="876" y="404" width="120" height="70" rx="14"/><text class="h" x="936" y="431" text-anchor="middle">koji + yeast</text><text class="s" x="936" y="453" text-anchor="middle">overlap → sake</text></svg>
