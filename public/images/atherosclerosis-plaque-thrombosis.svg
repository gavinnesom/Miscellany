<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Atherosclerosis Plaque and Thrombosis</title>
<desc id="desc">Four-stage artery wall cutaway showing plaque in the wall and thrombus after disruption.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9eff"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:28px;font-weight:700;fill:#1d252d}.l{font-size:18px;font-weight:650;fill:#1d252d}.s{font-size:14px;fill:#596774}.eq{font-size:17px;font-weight:650;fill:#005fb8}</style></defs>
<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">Atherosclerosis Plaque and Thrombosis</text>
<rect x="48" y="82" width="1024" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><g transform="translate(78 126)"><text x="120" y="0" text-anchor="middle" class="l">1 healthy wall</text><rect x="0" y="45" width="230" height="96" rx="48" fill="#f7fafc" stroke="#d6e0e8"/><rect x="0" y="77" width="230" height="32" fill="#fff"/><text x="115" y="166" text-anchor="middle" class="s">open lumen</text></g><g transform="translate(318 126)"><text x="120" y="0" text-anchor="middle" class="l">2 retained LDL</text><rect x="0" y="45" width="230" height="96" rx="48" fill="#f7fafc" stroke="#d6e0e8"/><rect x="0" y="77" width="230" height="32" fill="#fff"/><circle cx="82" cy="116" r="9" fill="#b98519"/><circle cx="112" cy="123" r="9" fill="#b98519"/><circle cx="142" cy="116" r="9" fill="#b98519"/><circle cx="124" cy="137" r="11" fill="#0b8f8a"/><text x="115" y="166" text-anchor="middle" class="s">wall inflammation</text></g><g transform="translate(558 126)"><text x="120" y="0" text-anchor="middle" class="l">3 fibrous plaque</text><rect x="0" y="45" width="230" height="96" rx="48" fill="#f7fafc" stroke="#d6e0e8"/><rect x="0" y="77" width="230" height="32" fill="#fff"/><path d="M58 110 C86 70 150 72 174 110 C142 128 92 130 58 110" fill="#fff0c7" stroke="#b98519" stroke-width="3"/><path d="M70 102 C98 82 140 82 164 102" fill="none" stroke="#0b8f8a" stroke-width="5"/><text x="115" y="166" text-anchor="middle" class="s">cap separates blood from core</text></g><g transform="translate(798 126)"><text x="120" y="0" text-anchor="middle" class="l">4 thrombus</text><rect x="0" y="45" width="230" height="96" rx="48" fill="#f7fafc" stroke="#d6e0e8"/><rect x="0" y="77" width="230" height="32" fill="#fff"/><path d="M50 110 C86 70 150 72 178 110 C144 128 88 130 50 110" fill="#fff0c7" stroke="#b98519" stroke-width="3"/><path d="M116 86 L140 108" stroke="#1d252d" stroke-width="4"/><circle cx="154" cy="83" r="14" fill="#c2410c"/><circle cx="178" cy="92" r="14" fill="#c2410c"/><circle cx="194" cy="78" r="14" fill="#c2410c"/><text x="115" y="166" text-anchor="middle" class="s">rupture/erosion → clot</text></g><text x="560" y="440" text-anchor="middle" class="eq">plaque is built in the artery wall; acute risk often comes from thrombosis</text>
</svg>
