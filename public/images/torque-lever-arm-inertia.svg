<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Torque and Rotational Inertia</title>
<desc id="desc">Door torque lever arms and hoop versus disk mass distribution.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9eff"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:28px;font-weight:700;fill:#1d252d}.l{font-size:18px;font-weight:650;fill:#1d252d}.s{font-size:14px;fill:#596774}.eq{font-size:17px;font-weight:650;fill:#005fb8}</style></defs>
<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">Torque and Rotational Inertia</text>
<rect x="48" y="82" width="1024" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><g transform="translate(88 118)"><rect x="0" y="0" width="260" height="280" rx="8" fill="#f7fafc" stroke="#d6e0e8"/><line x1="42" y1="24" x2="42" y2="256" stroke="#1d252d" stroke-width="8"/><rect x="42" y="42" width="170" height="190" fill="#fff8e8" stroke="#b98519" stroke-width="3"/><circle cx="54" cy="136" r="5" fill="#1d252d"/><line x1="76" y1="88" x2="136" y2="88" stroke="#c2410c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="150" y1="136" x2="210" y2="136" stroke="#c2410c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="198" y1="198" x2="238" y2="228" stroke="#c2410c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="130" y="272" text-anchor="middle" class="l">same F, different r⊥</text></g><g transform="translate(430 116)"><text x="190" y="0" text-anchor="middle" class="l">torque geometry</text><line x1="60" y1="165" x2="330" y2="165" stroke="#1d252d" stroke-width="4"/><circle cx="60" cy="165" r="8" fill="#1d252d"/><line x1="260" y1="165" x2="260" y2="75" stroke="#c2410c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="60" y1="165" x2="260" y2="165" stroke="#005fb8" stroke-width="3" stroke-dasharray="6 6"/><text x="158" y="150" class="eq">r</text><text x="278" y="112" class="eq">F</text><text x="150" y="220" class="eq">τ = rF sinθ</text></g><g transform="translate(760 130)"><text x="150" y="0" text-anchor="middle" class="l">same M,R: different I</text><circle cx="85" cy="120" r="58" fill="none" stroke="#005fb8" stroke-width="18"/><circle cx="225" cy="120" r="58" fill="#dff3f2" stroke="#0b8f8a" stroke-width="3"/><circle cx="85" cy="120" r="4" fill="#1d252d"/><circle cx="225" cy="120" r="4" fill="#1d252d"/><text x="85" y="210" text-anchor="middle" class="eq">hoop I=MR²</text><text x="225" y="210" text-anchor="middle" class="eq">disk I=1/2MR²</text></g>
</svg>
