<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Differential Gears</title>
  <desc id="desc">Explanatory visual for Differential Gears.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e9eff"/></marker>
  </defs>
  <rect width="960" height="540" fill="transparent"/>
  <text x="48" y="54" text-anchor="start" font-size="28" font-weight="700" fill="#1d252d"><tspan x="48" dy="0">Differential Gears</tspan></text>
  <circle cx="480" cy="285" r="86" fill="#eaf4fc" stroke="#2e9eff" stroke-width="4"/>
<circle cx="480" cy="285" r="35" fill="#fff" stroke="#d6e0e8" stroke-width="2"/>
<line x1="190" y1="285" x2="394" y2="285" stroke="#1d252d" stroke-width="8" stroke-linecap="round"/>
<line x1="566" y1="285" x2="770" y2="285" stroke="#1d252d" stroke-width="8" stroke-linecap="round"/>
<circle cx="170" cy="285" r="48" fill="#e7f3ff" stroke="#005fb8" stroke-width="2"/>
<circle cx="790" cy="285" r="48" fill="#e7f3ff" stroke="#005fb8" stroke-width="2"/>
<text x="170" y="365" text-anchor="middle" font-size="17" font-weight="500" fill="#1d252d"><tspan x="170" dy="0">inside wheel
slower</tspan></text>
<text x="790" y="365" text-anchor="middle" font-size="17" font-weight="500" fill="#1d252d"><tspan x="790" dy="0">outside wheel
faster</tspan></text>
<path d="M430 240 C460 210 505 210 535 240" fill="none" stroke="#004f99" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M430 330 C460 360 505 360 535 330" fill="none" stroke="#004f99" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="480" y="205" text-anchor="middle" font-size="18" font-weight="500" fill="#596774"><tspan x="480" dy="0">spider gears let axle speeds differ</tspan></text>
</svg>
