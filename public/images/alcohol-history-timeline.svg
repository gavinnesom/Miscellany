<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Alcohol history timeline</title><desc id="desc">Timeline separating prehistoric fermentation evidence, distillation technology and the later word alcohol.</desc><rect width="1120" height="620" fill="transparent"/><style>
.title{font:700 30px Georgia,serif;fill:#1d252d}.h{font:800 18px system-ui,sans-serif;fill:#1d252d}.s{font:600 14px system-ui,sans-serif;fill:#596774}.m{font:800 15px ui-monospace,Menlo,monospace;fill:#005fb8}.panel{fill:#fff;stroke:#d6e0e8;stroke-width:2}.soft{fill:#edf4fa;stroke:#d6e0e8;stroke-width:1.5}.blue{fill:#e7f3ff;stroke:#005fb8;stroke-width:2.5}.teal{fill:#dff0ff;stroke:#247a8a;stroke-width:2.5}.warn{fill:#fff;stroke:#b44747;stroke-width:2}.arrow{fill:none;stroke:#005fb8;stroke-width:3;stroke-linecap:round;marker-end:url(#a)}.thin{fill:none;stroke:#247a8a;stroke-width:2.5;stroke-linecap:round;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#005fb8"/></marker></defs>
<text class="title" x="50" y="55">Alcohol history: fermentation, stills and the word</text><text class="s" x="50" y="82">Markers are reference-grounded summaries, not exact artifact drawings.</text>
<line x1="80" y1="230" x2="1030" y2="230" stroke="#d6e0e8" stroke-width="5"/><text class="h" x="80" y="178">ancient evidence</text>
<circle class="teal" cx="130" cy="230" r="13"/><text class="m" x="130" y="268" text-anchor="middle">~13,000 yr</text><foreignObject x="38" y="282" width="184" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:600 13px system-ui;color:#596774;text-align:center">Raqefet: interpreted cereal-beer brewing evidence</div></foreignObject><circle class="teal" cx="360" cy="230" r="13"/><text class="m" x="360" y="268" text-anchor="middle">7000–6600 BCE</text><foreignObject x="268" y="282" width="184" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:600 13px system-ui;color:#596774;text-align:center">Jiahu: rice-honey-fruit fermented beverage</div></foreignObject><circle class="teal" cx="570" cy="230" r="13"/><text class="m" x="570" y="268" text-anchor="middle">6000–5800 BCE</text><foreignObject x="478" y="282" width="184" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:600 13px system-ui;color:#596774;text-align:center">Georgia: grape wine / viniculture</div></foreignObject><circle class="teal" cx="790" cy="230" r="13"/><text class="m" x="790" y="268" text-anchor="middle">1st c BCE</text><foreignObject x="698" y="282" width="184" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:600 13px system-ui;color:#596774;text-align:center">Haihun: water-cooled distillation apparatus</div></foreignObject>
<line x1="210" y1="444" x2="920" y2="444" stroke="#d6e0e8" stroke-width="5" stroke-dasharray="10 8"/><text class="h" x="210" y="398">word history enlarged</text>
<circle class="blue" cx="320" cy="444" r="12"/><text class="m" x="320" y="482" text-anchor="middle">medieval / early modern</text><text class="s" x="320" y="506" text-anchor="middle">fine powder → refined essence</text><circle class="blue" cx="650" cy="444" r="12"/><text class="m" x="650" y="482" text-anchor="middle">18th c</text><text class="s" x="650" y="506" text-anchor="middle">ethanol sense established</text><circle class="blue" cx="850" cy="444" r="12"/><text class="m" x="850" y="482" text-anchor="middle">modern chemistry</text><text class="s" x="850" y="506" text-anchor="middle">class of alcohols</text>
<rect class="soft" x="94" y="560" width="932" height="34" rx="17"/><text class="s" x="560" y="582" text-anchor="middle">Archaeological evidence ≠ labeled bottles; the word is much younger than fermentation.</text></svg>
