<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Alcohol family map</title><desc id="desc">Raw materials become fermented drinks and sometimes distilled spirits.</desc><rect width="1120" height="620" fill="transparent"/><style>
.title{font:700 30px Georgia,serif;fill:#1d252d}.h{font:800 18px system-ui,sans-serif;fill:#1d252d}.s{font:600 14px system-ui,sans-serif;fill:#596774}.m{font:800 15px ui-monospace,Menlo,monospace;fill:#005fb8}.panel{fill:#fff;stroke:#d6e0e8;stroke-width:2}.soft{fill:#edf4fa;stroke:#d6e0e8;stroke-width:1.5}.blue{fill:#e7f3ff;stroke:#005fb8;stroke-width:2.5}.teal{fill:#dff0ff;stroke:#247a8a;stroke-width:2.5}.warn{fill:#fff;stroke:#b44747;stroke-width:2}.arrow{fill:none;stroke:#005fb8;stroke-width:3;stroke-linecap:round;marker-end:url(#a)}.thin{fill:none;stroke:#247a8a;stroke-width:2.5;stroke-linecap:round;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#005fb8"/></marker></defs>
<text class="title" x="50" y="55">Alcohol families follow material and process</text><text class="s" x="50" y="82">Fermentation creates ethanol; distillation separates and concentrates it.</text>
<g transform="translate(50 120)"><rect class="panel" width="1020" height="410" rx="18"/>
<rect class="blue" x="32" y="34" width="128" height="38" rx="12"/><text class="h" x="96" y="59" text-anchor="middle">fruit</text><rect class="blue" x="32" y="92" width="128" height="38" rx="12"/><text class="h" x="96" y="117" text-anchor="middle">honey</text><rect class="blue" x="32" y="150" width="128" height="38" rx="12"/><text class="h" x="96" y="175" text-anchor="middle">grain</text><rect class="blue" x="32" y="208" width="128" height="38" rx="12"/><text class="h" x="96" y="233" text-anchor="middle">rice</text><rect class="blue" x="32" y="266" width="128" height="38" rx="12"/><text class="h" x="96" y="291" text-anchor="middle">sugar cane</text><rect class="blue" x="32" y="324" width="128" height="38" rx="12"/><text class="h" x="96" y="349" text-anchor="middle">agave</text>
<rect class="soft" x="230" y="46" width="182" height="72" rx="14"/><text class="h" x="321" y="76" text-anchor="middle">sugars ready</text><text class="s" x="321" y="98" text-anchor="middle">fruit / honey</text>
<rect class="soft" x="230" y="174" width="182" height="94" rx="14"/><text class="h" x="321" y="204" text-anchor="middle">saccharify</text><text class="s" x="321" y="226" text-anchor="middle">malt/mash or koji</text><text class="s" x="321" y="248" text-anchor="middle">unlocks starch</text>
<rect class="soft" x="230" y="314" width="182" height="60" rx="14"/><text class="h" x="321" y="350" text-anchor="middle">cook agave</text>
<rect class="teal" x="484" y="165" width="150" height="74" rx="18"/><text class="h" x="559" y="195" text-anchor="middle">ferment</text><text class="s" x="559" y="217" text-anchor="middle">microbes make ethanol</text>
<rect class="blue" x="700" y="58" width="126" height="48" rx="14"/><text class="h" x="763" y="88" text-anchor="middle">wine/cider</text>
<rect class="blue" x="700" y="122" width="126" height="48" rx="14"/><text class="h" x="763" y="152" text-anchor="middle">mead</text>
<rect class="blue" x="700" y="186" width="126" height="48" rx="14"/><text class="h" x="763" y="216" text-anchor="middle">beer/sake</text>
<rect class="teal" x="690" y="290" width="154" height="60" rx="16"/><text class="h" x="767" y="315" text-anchor="middle">distill?</text><text class="s" x="767" y="337" text-anchor="middle">optional separation</text>
<rect class="soft" x="884" y="244" width="104" height="128" rx="16"/><text class="s" x="936" y="272" text-anchor="middle">whisky</text><text class="s" x="936" y="294" text-anchor="middle">brandy</text><text class="s" x="936" y="316" text-anchor="middle">rum</text><text class="s" x="936" y="338" text-anchor="middle">agave spirits</text><text class="s" x="936" y="360" text-anchor="middle">vodka / gin</text>
<path class="arrow" d="M160 53 H230"/><path class="arrow" d="M160 111 C190 92 204 82 230 82"/><path class="arrow" d="M160 169 C190 190 204 205 230 216"/><path class="arrow" d="M160 227 H230"/><path class="arrow" d="M160 285 C190 315 204 340 230 344"/><path class="arrow" d="M412 82 C455 105 482 137 505 165"/><path class="arrow" d="M412 221 H484"/><path class="arrow" d="M412 344 C455 314 484 270 520 239"/><path class="arrow" d="M634 202 C678 150 690 100 700 82"/><path class="arrow" d="M634 202 H700"/><path class="arrow" d="M634 225 C670 260 694 286 720 304"/><path class="arrow" d="M844 320 H884"/>
</g><rect class="soft" x="190" y="558" width="740" height="36" rx="18"/><text class="s" x="560" y="581" text-anchor="middle">Family identity comes from source material, sugar access, fermentation, distillation and later treatment.</text></svg>
