<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Great Oxidation Event</title>
  <desc id="desc">Explanatory visual for Great Oxidation Event.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e9eff"/></marker>
  </defs>
  <rect width="960" height="540" fill="transparent"/>
  <text x="48" y="54" text-anchor="start" font-size="28" font-weight="700" fill="#1d252d"><tspan x="48" dy="0">Great Oxidation Event</tspan></text>
  <circle cx="115" cy="300" r="52" fill="#dff0ff" stroke="#d6e0e8" stroke-width="2"/>
<text x="115" y="292" text-anchor="middle" font-size="17" font-weight="700" fill="#1d252d"><tspan x="115" dy="0">cyanobacteria</tspan></text>
<line x1="177" y1="300" x2="235.5" y2="300" stroke="#2e9eff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="297.5" cy="300" r="52" fill="#e7f3ff" stroke="#d6e0e8" stroke-width="2"/>
<text x="297.5" y="292" text-anchor="middle" font-size="17" font-weight="700" fill="#1d252d"><tspan x="297.5" dy="0">O2
production</tspan></text>
<line x1="359.5" y1="300" x2="418" y2="300" stroke="#2e9eff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="480" cy="300" r="52" fill="#eaf4fc" stroke="#d6e0e8" stroke-width="2"/>
<text x="480" y="292" text-anchor="middle" font-size="17" font-weight="700" fill="#1d252d"><tspan x="480" dy="0">Fe2+
oxidized</tspan></text>
<line x1="542" y1="300" x2="600.5" y2="300" stroke="#2e9eff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="662.5" cy="300" r="52" fill="#eaf4fc" stroke="#d6e0e8" stroke-width="2"/>
<text x="662.5" y="292" text-anchor="middle" font-size="17" font-weight="700" fill="#1d252d"><tspan x="662.5" dy="0">iron
bands</tspan></text>
<line x1="724.5" y1="300" x2="783" y2="300" stroke="#2e9eff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="845" cy="300" r="52" fill="#e7f3ff" stroke="#d6e0e8" stroke-width="2"/>
<text x="845" y="292" text-anchor="middle" font-size="17" font-weight="700" fill="#1d252d"><tspan x="845" dy="0">atmospheric
O2</tspan></text>
</svg>
