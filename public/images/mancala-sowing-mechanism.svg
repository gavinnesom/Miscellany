<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Mancala Sowing Mechanism</title>
<desc id="desc">Oware-style pit counts before and after sowing.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9eff"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.h{font-size:28px;font-weight:700;fill:#1d252d}.l{font-size:18px;font-weight:650;fill:#1d252d}.s{font-size:14px;fill:#596774}.eq{font-size:17px;font-weight:650;fill:#005fb8}</style></defs>
<rect width="1120" height="560" fill="transparent"/>
<text x="42" y="48" class="h">Mancala Sowing Mechanism</text>
<rect x="48" y="82" width="1024" height="420" rx="10" fill="#ffffff" stroke="#d6e0e8" stroke-width="2"/><g transform="translate(100 126)"><text x="150" y="0" text-anchor="middle" class="l">initial state</text><circle cx="45" cy="64" r="18" fill="#fff8e8" stroke="#b98519"/><text x="45" y="70" text-anchor="middle" class="eq">3</text><circle cx="87" cy="64" r="18" fill="#fff8e8" stroke="#b98519"/><text x="87" y="70" text-anchor="middle" class="eq">1</text><circle cx="129" cy="64" r="18" fill="#fff8e8" stroke="#b98519"/><text x="129" y="70" text-anchor="middle" class="eq">0</text><circle cx="171" cy="64" r="18" fill="#fff8e8" stroke="#b98519"/><text x="171" y="70" text-anchor="middle" class="eq">5</text><circle cx="213" cy="64" r="18" fill="#fff8e8" stroke="#b98519"/><text x="213" y="70" text-anchor="middle" class="eq">2</text><circle cx="255" cy="64" r="18" fill="#fff8e8" stroke="#b98519"/><text x="255" y="70" text-anchor="middle" class="eq">4</text><circle cx="45" cy="124" r="18" fill="#f7fafc" stroke="#d6e0e8"/><text x="45" y="130" text-anchor="middle" class="eq">4</text><circle cx="87" cy="124" r="18" fill="#f7fafc" stroke="#d6e0e8"/><text x="87" y="130" text-anchor="middle" class="eq">4</text><circle cx="129" cy="124" r="18" fill="#f7fafc" stroke="#d6e0e8"/><text x="129" y="130" text-anchor="middle" class="eq">4</text><circle cx="171" cy="124" r="18" fill="#f7fafc" stroke="#d6e0e8"/><text x="171" y="130" text-anchor="middle" class="eq">4</text><circle cx="213" cy="124" r="18" fill="#f7fafc" stroke="#d6e0e8"/><text x="213" y="130" text-anchor="middle" class="eq">4</text><circle cx="255" cy="124" r="18" fill="#f7fafc" stroke="#d6e0e8"/><text x="255" y="130" text-anchor="middle" class="eq">4</text><rect x="10" y="32" width="280" height="124" rx="38" fill="none" stroke="#d6e0e8" stroke-width="4"/></g><line x1="410" y1="220" x2="510" y2="220" stroke="#2e9eff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g transform="translate(520 126)"><text x="150" y="0" text-anchor="middle" class="l">lift 5, sow one-by-one</text><path d="M40 70 C120 10 210 10 282 70" fill="none" stroke="#0b8f8a" stroke-width="4" marker-end="url(#arrow)"/><circle cx="70" cy="94" r="9" fill="#0b8f8a"/><circle cx="112" cy="82" r="9" fill="#0b8f8a"/><circle cx="154" cy="74" r="9" fill="#0b8f8a"/><circle cx="196" cy="82" r="9" fill="#0b8f8a"/><circle cx="238" cy="94" r="9" fill="#0b8f8a"/><text x="150" y="150" text-anchor="middle" class="s">one counter into each following pit</text></g><line x1="810" y1="220" x2="910" y2="220" stroke="#2e9eff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g transform="translate(850 126)"><text x="120" y="0" text-anchor="middle" class="l">result</text><circle cx="28" cy="84" r="16" fill="#fff8e8" stroke="#b98519"/><text x="28" y="90" text-anchor="middle" class="eq">3</text><circle cx="63" cy="84" r="16" fill="#fff8e8" stroke="#b98519"/><text x="63" y="90" text-anchor="middle" class="eq">1</text><circle cx="98" cy="84" r="16" fill="#fff8e8" stroke="#b98519"/><text x="98" y="90" text-anchor="middle" class="eq">0</text><circle cx="133" cy="84" r="16" fill="#fff8e8" stroke="#b98519"/><text x="133" y="90" text-anchor="middle" class="eq">0</text><circle cx="168" cy="84" r="16" fill="#fff8e8" stroke="#b98519"/><text x="168" y="90" text-anchor="middle" class="eq">3</text><circle cx="203" cy="84" r="16" fill="#fff8e8" stroke="#b98519"/><text x="203" y="90" text-anchor="middle" class="eq">5</text><text x="120" y="146" text-anchor="middle" class="s">counting creates strategy</text></g>
</svg>
